<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猩猩导演台 · 一站式短剧创作工作台</title>
<style>
/* ============================================================
   猩猩导演台 · GORILLA STUDIO
   深色专业创作台主题
   ============================================================ */

/* 兜底：hidden 属性必须胜过后面任何 display 规则（如 .modal-backdrop 的 display:grid） */
[hidden]{display:none!important}

:root{
  --bg-0:#0d0f14;          /* 最底 */
  --bg-1:#12151c;          /* 侧栏 */
  --bg-2:#171b24;          /* 工作区 */
  --bg-3:#1d222d;          /* 卡片 */
  --bg-4:#242a37;          /* 卡片悬浮 / 输入 */
  --bg-5:#2d3543;          /* 边框亮 */
  --line:#252b37;          /* 分隔线 */
  --line-soft:#1e242f;
  --txt-0:#f2f4f8;         /* 主文字 */
  --txt-1:#c2c9d6;         /* 次文字 */
  --txt-2:#8b94a5;         /* 弱文字 */
  --txt-3:#5d6675;         /* 更弱 */
  --brand:#ff6b35;         /* 猩猩橙 */
  --brand-2:#ff9d3d;       /* 橙黄 */
  --brand-soft:rgba(255,107,53,.13);
  --brand-line:rgba(255,107,53,.4);
  --violet:#9b7bff;        /* 辅助紫 */
  --teal:#3ecfb0;          /* 辅助青 */
  --blue:#5aa9ff;          /* 辅助蓝 */
  --red:#ff5d6c;
  --yellow:#ffc94d;
  --ok:#3ecfb0;
  --warn:#ffc94d;
  --err:#ff5d6c;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --font:"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg-0);
  color:var(--txt-0);
  font-size:13px;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--brand-soft);color:var(--brand-2)}

/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c3442;border-radius:6px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-thumb:hover{background:#3a4454}

/* ============ 布局骨架 ============ */
.app-shell{height:100vh;display:flex;flex-direction:column}
.topbar{
  height:60px;flex:none;display:flex;align-items:center;gap:16px;
  padding:0 20px;background:var(--bg-1);border-bottom:1px solid var(--line);
  z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 4px 14px rgba(255,107,53,.35);
}
.brand-text{line-height:1.15}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.5px}
.brand-sub{font-size:9px;color:var(--txt-3);letter-spacing:1.6px;font-weight:600;margin-top:2px}

.project-switcher{
  position:relative;display:flex;align-items:center;gap:9px;
  padding:8px 13px;background:var(--bg-3);border:1px solid var(--line);
  border-radius:9px;cursor:pointer;min-width:220px;max-width:320px;
  transition:border-color .15s;
}
.project-switcher:hover{border-color:var(--brand-line)}
.ps-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none;box-shadow:0 0 8px var(--brand)}
.ps-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ps-caret{color:var(--txt-2);font-size:11px}
.ps-menu{
  display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--bg-3);border:1px solid var(--line-soft);border-radius:10px;
  padding:6px;box-shadow:var(--shadow);z-index:50;max-height:340px;overflow:auto;
}
.ps-menu.open{display:block}
.ps-menu-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;cursor:pointer}
.ps-menu-item:hover{background:var(--bg-4)}
.ps-menu-item.active{background:var(--brand-soft)}
.ps-menu-item .pmi-emoji{font-size:16px}
.ps-menu-item .pmi-name{flex:1;font-weight:500}
.ps-menu-item .pmi-check{color:var(--brand)}
.ps-menu-sep{height:1px;background:var(--line);margin:5px 4px}

.topbar-spacer{flex:1}
.save-state{display:flex;align-items:center;gap:7px;color:var(--txt-2);font-size:12px}
.ss-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save-state.saving .ss-dot{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.avatar{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#ff8a5b,#c2410c);font-weight:700;color:#fff;
  border:2px solid var(--bg-0);box-shadow:0 0 0 1px var(--line);
}

.main-row{flex:1;display:flex;min-height:0}

/* ============ 侧栏 ============ */
.sidebar{
  width:220px;flex:none;background:var(--bg-1);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 10px 0;overflow:hidden;
}
.nav-section-label{
  font-size:10px;color:var(--txt-3);letter-spacing:1.4px;font-weight:700;
  padding:0 12px;margin:6px 0 8px;
}
.nav-list{list-style:none;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;
  color:var(--txt-1);cursor:pointer;position:relative;transition:background .14s,color .14s;
  user-select:none;
}
.nav-item:hover{background:var(--bg-3);color:var(--txt-0)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-2);font-weight:600}
.nav-item.active::before{
  content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  background:var(--brand);border-radius:0 3px 3px 0;
}
.nav-ico{width:20px;text-align:center;font-size:15px;opacity:.9}
.nav-label{flex:1;font-size:13px}
.nav-num{
  font-size:10px;color:var(--txt-3);background:var(--bg-3);
  min-width:20px;padding:1px 6px;border-radius:10px;text-align:center;
}
.nav-item.active .nav-num{background:rgba(255,107,53,.22);color:var(--brand-2)}

.sidebar-foot{margin-top:auto;padding:12px 4px 14px}
.pipe-mini{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.pipe-mini-title{font-size:10px;color:var(--txt-3);letter-spacing:1px;font-weight:700;margin-bottom:10px}
.pipe-steps{display:flex;align-items:center;gap:0}
.pipe-step{display:flex;align-items:center;flex:1}
.pipe-node{
  width:15px;height:15px;border-radius:50%;border:2px solid var(--bg-5);flex:none;
  display:grid;place-items:center;font-size:8px;color:transparent;transition:all .2s;
}
.pipe-node.done{background:var(--ok);border-color:var(--ok);color:#06251f}
.pipe-node.current{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.pipe-line{height:2px;background:var(--bg-5);flex:1}
.pipe-line.done{background:var(--ok)}

/* ============ 工作区 ============ */
.workspace{flex:1;overflow:auto;background:var(--bg-2);position:relative}
.view{padding:26px 30px 60px;max-width:1500px;margin:0 auto;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.view-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.view-title{font-size:22px;font-weight:700;letter-spacing:.3px}
.view-desc{color:var(--txt-2);font-size:12.5px;margin-top:4px;max-width:720px}
.view-head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--brand);font-weight:800;text-transform:uppercase;margin-bottom:6px}

/* ============ 通用组件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:8px;border:1px solid transparent;
  font-size:12.5px;font-weight:600;transition:all .15s;white-space:nowrap;
}
.btn-sm{padding:7px 11px;font-size:12px}
.btn-xs{padding:5px 9px;font-size:11px;border-radius:6px}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 3px 12px rgba(255,107,53,.28)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{background:var(--bg-3);color:var(--txt-1);border-color:var(--line)}
.btn-ghost:hover{background:var(--bg-4);color:var(--txt-0);border-color:var(--bg-5)}
.btn-outline{background:transparent;color:var(--brand-2);border-color:var(--brand-line)}
.btn-outline:hover{background:var(--brand-soft)}
.btn-danger{background:transparent;color:var(--err);border-color:rgba(255,93,108,.3)}
.btn-danger:hover{background:rgba(255,93,108,.12)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;filter:none!important}

.card{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:14px;font-weight:700}
.card-head .sub{color:var(--txt-2);font-size:11px}
.card-head .spacer{flex:1}

.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.g-2,.g-3,.g-4{grid-template-columns:1fr}}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;background:var(--bg-4);color:var(--txt-1)}
.tag.brand{background:var(--brand-soft);color:var(--brand-2)}
.tag.ok{background:rgba(62,207,176,.14);color:var(--teal)}
.tag.warn{background:rgba(255,201,77,.14);color:var(--yellow)}
.tag.err{background:rgba(255,93,108,.14);color:var(--err)}
.tag.violet{background:rgba(155,123,255,.15);color:var(--violet)}
.tag.blue{background:rgba(90,169,255,.14);color:var(--blue)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11.5px;color:var(--txt-2);font-weight:600}
.field .hint{font-size:10.5px;color:var(--txt-3)}
.input,.textarea,.select{
  width:100%;background:var(--bg-4);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;color:var(--txt-0);outline:none;transition:border-color .15s;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--brand-line)}
.textarea{resize:vertical;min-height:90px;line-height:1.6}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b94a5'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}

.empty{
  text-align:center;padding:60px 20px;color:var(--txt-2);
  border:1px dashed var(--line);border-radius:var(--radius);background:var(--bg-3);
}
.empty .e-ico{font-size:44px;opacity:.45;margin-bottom:14px}
.empty .e-title{font-size:15px;color:var(--txt-1);font-weight:600;margin-bottom:6px}
.empty .e-desc{font-size:12px;margin-bottom:18px}

.divider{height:1px;background:var(--line);margin:18px 0}

/* ============ 项目台 ============ */
.proj-card{
  background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:all .18s;position:relative;
}
.proj-card:hover{transform:translateY(-3px);border-color:var(--brand-line);box-shadow:var(--shadow)}
.proj-cover{
  height:120px;display:flex;align-items:center;justify-content:center;font-size:46px;
  position:relative;overflow:hidden;
}
.proj-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.25))}
.proj-cover .pc-badge{position:absolute;top:12px;left:12px;z-index:2}
.proj-body{padding:15px 16px 16px}
.proj-name{font-size:14px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-meta{font-size:11px;color:var(--txt-3);margin-bottom:13px}
.proj-progress{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.progress-track{height:5px;background:var(--bg-5);border-radius:4px;flex:1;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:4px;transition:width .4s}
.proj-progress .pct{font-size:10.5px;color:var(--txt-2);width:30px;text-align:right}
.proj-foot{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.proj-chip{font-size:10px;color:var(--txt-2);background:var(--bg-4);padding:3px 8px;border-radius:6px}

/* 统计条 */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:760px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat-box{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat-label{font-size:11px;color:var(--txt-2);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.stat-val{font-size:26px;font-weight:800;line-height:1}
.stat-val small{font-size:12px;color:var(--txt-3);font-weight:500;margin-left:4px}
.stat-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px}

/* ============ 剧本工坊 ============ */
.script-layout{display:grid;grid-template-columns:minmax(320px,.85fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media(max-width:1000px){.script-layout{grid-template-columns:1fr}}
.source-area{width:100%;min-height:420px;font-family:var(--font)}
.script-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.scene-block{
  background:var(--bg-4);border:1px solid var(--line);border-left:3px solid var(--brand);
  border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:12px;
}
.scene-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.scene-id{font-size:10px;font-weight:800;color:var(--brand-2);letter-spacing:.5px}
.scene-loc{color:var(--txt-2);font-size:11px}
.scene-text{white-space:pre-wrap;color:var(--txt-1);font-size:12.5px;line-height:1.75}
.dialog-line{color:var(--txt-0)}
.dialog-line .who{color:var(--brand-2);font-weight:600}

.metric-inline{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px;background:var(--bg-3);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.metric{display:flex;flex-direction:column;gap:2px}
.metric .m-lab{font-size:10px;color:var(--txt-3);letter-spacing:.5px}
.metric .m-val{font-size:17px;font-weight:700}
.metric .m-val.warn{color:var(--warn)}

/* ============ 设定中枢 ============ */
.char-card{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .15s}
.char-card:hover{border-color:var(--bg-5)}
.char-views{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line)}
.view-slot{aspect-ratio:3/4;background:linear-gradient(160deg,#202634,#171b24);display:grid;place-items:center;position:relative;overflow:hidden}
.view-slot .vs-figure{font-size:44px;filter:grayscale(.3);opacity:.85}
.view-slot .vs-label{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9px;color:var(--txt-3);background:rgba(0,0,0,.35);padding:2px 0}
.view-slot.empty-vs{border:1px dashed var(--bg-5);background:var(--bg-2)}
.view-slot.empty-vs .vs-figure{font-size:22px;opacity:.35}
.char-info{padding:13px 15px}
.char-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.char-role{font-size:11px;color:var(--brand-2);margin-bottom:8px}
.char-desc{font-size:11.5px;color:var(--txt-2);line-height:1.6;margin-bottom:10px;min-height:36px}
.char-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.char-actions{display:flex;gap:6px}
.prompt-box{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;font-size:10.5px;color:var(--txt-3);line-height:1.5;font-family:monospace;max-height:60px;overflow:auto;margin-bottom:10px}

/* ============ 分镜台 ============ */
.shot-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.shot-row{
  background:var(--bg-3);border:1px solid var(--line);border-radius:10px;
  display:grid;grid-template-columns:64px 1fr;overflow:hidden;transition:border-color .15s;
}
.shot-row:hover{border-color:var(--bg-5)}
.shot-no{
  background:var(--bg-4);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;border-right:1px solid var(--line);padding:10px 4px;
}
.shot-no .sn-id{font-size:10px;color:var(--brand-2);font-weight:700}
.shot-no .sn-dur{font-size:15px;font-weight:800;margin-top:3px}
.shot-no .sn-dur small{font-size:9px;color:var(--txt-3);font-weight:500}
.shot-main{padding:12px 15px;min-width:0}
.shot-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.shot-title{font-weight:700;font-size:13px}
.shot-tagline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.shot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;font-size:11.5px}
@media(max-width:700px){.shot-grid{grid-template-columns:1fr}}
.shot-field{display:flex;gap:7px;min-width:0}
.shot-field .sf-k{color:var(--txt-3);flex:none;width:46px}
.shot-field .sf-v{color:var(--txt-1);line-height:1.5}
.shot-actions{display:flex;gap:6px;margin-top:10px}

.summary-bar{
  background:linear-gradient(135deg,var(--bg-3),var(--bg-4));
  border:1px solid var(--brand-line);border-radius:12px;padding:16px 20px;
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-bottom:18px;
}
.sum-item{display:flex;flex-direction:column;gap:2px}
.sum-item .si-lab{font-size:10px;color:var(--txt-3);letter-spacing:.5px}
.sum-item .si-val{font-size:19px;font-weight:800}
.sum-item .si-val.brand{color:var(--brand-2)}

/* ============ 生成工场 ============ */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media(max-width:900px){.kanban{grid-template-columns:1fr}}
.kb-col{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-height:220px}
.kb-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.kb-dot{width:8px;height:8px;border-radius:50%}
.kb-title{font-weight:700;font-size:12.5px}
.kb-count{margin-left:auto;font-size:10px;color:var(--txt-3);background:var(--bg-4);padding:2px 7px;border-radius:10px}
.gen-card{background:var(--bg-4);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px}
.gen-card-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.gen-thumb{width:38px;height:38px;border-radius:7px;background:linear-gradient(135deg,#2a3342,#1a202b);display:grid;place-items:center;font-size:17px;flex:none}
.gen-name{font-size:11.5px;font-weight:600;line-height:1.3}
.gen-sub{font-size:10px;color:var(--txt-3);margin-top:2px}
.gen-prompt{font-size:10.5px;color:var(--txt-2);line-height:1.5;margin:8px 0;max-height:44px;overflow:hidden}
.gen-bar{height:4px;background:var(--bg-5);border-radius:3px;overflow:hidden;margin-top:8px}
.gen-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .4s}
.gen-actions{display:flex;gap:6px;margin-top:9px}

/* ============ 剪辑台 ============ */
.player{
  aspect-ratio:16/9;background:#000;border-radius:12px;border:1px solid var(--line);
  display:grid;place-items:center;position:relative;overflow:hidden;max-height:440px;margin:0 auto;
}
.player-inner{text-align:center;color:var(--txt-3)}
.player-inner .pl-ico{font-size:52px;opacity:.3;margin-bottom:8px}
.player-frame{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#1a2130,#0d1017)}
.player-frame .pf-emoji{font-size:80px;opacity:.5}
.player-overlay{position:absolute;bottom:14px;left:16px;right:16px;display:flex;align-items:center;gap:12px;color:#fff}
.play-btn{
  width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:16px;
}
.play-btn:hover{background:var(--brand)}
.time-read{font-size:11px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85)}

.timeline{background:var(--bg-3);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px;overflow-x:auto}
.tl-ruler{display:flex;margin-left:96px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.tl-tick{font-size:9px;color:var(--txt-3);flex:none;text-align:left}
.tl-track{display:flex;align-items:center;gap:0;margin-bottom:8px}
.tl-label{width:96px;flex:none;font-size:10.5px;color:var(--txt-2);display:flex;align-items:center;gap:6px}
.tl-label .tl-ico{font-size:13px}
.tl-clips{display:flex;gap:3px;flex:1;min-height:52px}
.tl-clip{
  flex:none;border-radius:6px;padding:6px 8px;min-width:60px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;cursor:grab;
  border:1px solid rgba(255,255,255,.12);transition:transform .12s,box-shadow .12s;
}
.tl-clip:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:2}
.tl-clip.selected{outline:2px solid var(--brand);outline-offset:-2px}
.tl-clip .tc-name{font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-clip .tc-dur{font-size:9px;opacity:.8}
.tl-clip .tc-trans{position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(255,255,255,.35)}

/* ============ 导出中心 ============ */
.export-layout{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media(max-width:1000px){.export-layout{grid-template-columns:1fr}}
.exp-preview{aspect-ratio:16/9;background:linear-gradient(135deg,#1a2130,#0d1017);border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;margin-bottom:14px;position:relative}
.exp-preview .ep-badge{position:absolute;top:12px;right:12px}
.exp-record{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-4);border:1px solid var(--line);border-radius:9px;margin-bottom:9px}
.exp-rec-ico{width:38px;height:38px;border-radius:8px;background:var(--bg-5);display:grid;place-items:center;font-size:16px}
.exp-rec-main{flex:1;min-width:0}
.exp-rec-name{font-weight:600;font-size:12.5px}
.exp-rec-meta{font-size:10.5px;color:var(--txt-3);margin-top:2px}

/* ============ 资产库 ============ */
.asset-tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.asset-tab{padding:9px 16px;cursor:pointer;color:var(--txt-2);font-weight:600;font-size:12.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.asset-tab:hover{color:var(--txt-0)}
.asset-tab.active{color:var(--brand-2);border-bottom-color:var(--brand)}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.asset-card{background:var(--bg-3);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:transform .15s,border-color .15s}
.asset-card:hover{transform:translateY(-2px);border-color:var(--brand-line)}
.asset-thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#232b3a,#151922);display:grid;place-items:center;font-size:38px;position:relative}
.asset-thumb .at-type{position:absolute;top:8px;left:8px}
.asset-meta{padding:10px 12px}
.asset-name{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-sub{font-size:10px;color:var(--txt-3);margin-top:3px}

/* ============ 弹窗 ============ */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px}
.modal{width:min(560px,100%);max-height:88vh;background:var(--bg-3);border:1px solid var(--bg-5);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:modalIn .22s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-title{font-size:15px;font-weight:700;flex:1}
.modal-close{background:none;border:none;color:var(--txt-2);font-size:16px;padding:4px 8px;border-radius:6px}
.modal-close:hover{background:var(--bg-4);color:var(--txt-0)}
.modal-body{padding:20px;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* ============ Toast ============ */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{
  background:var(--bg-4);border:1px solid var(--line);border-left:3px solid var(--ok);
  border-radius:9px;padding:11px 16px;box-shadow:var(--shadow);font-size:12.5px;
  display:flex;align-items:center;gap:9px;animation:toastIn .25s ease;min-width:220px;
}
.toast.err{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast .t-ico{font-size:15px}

/* 遮罩内小工具 */
.row{display:flex;gap:10px}
.row>*{flex:1}
.inline-input{display:flex;gap:8px}
.inline-input .input{flex:1}
.mini-note{font-size:10.5px;color:var(--txt-3);margin-top:6px;line-height:1.5}
.code-hint{font-family:monospace;font-size:10px;color:var(--txt-3);background:var(--bg-2);padding:2px 5px;border-radius:4px}

/* ============ 一键导入桥 / 真 AI（新增） ============ */
.bridge-strip{
  margin-top:14px;padding:13px 14px;border:1px dashed var(--brand-line);
  background:var(--brand-soft);border-radius:var(--radius-sm);
}
.bridge-strip-title{font-size:12px;font-weight:700;color:var(--brand-2);margin-bottom:5px}
.bridge-strip-desc{font-size:10.5px;color:var(--txt-2);line-height:1.6;margin-bottom:10px}

.bridge-drop{
  border:1.5px dashed var(--line);border-radius:var(--radius-sm);
  padding:24px 16px;text-align:center;background:var(--bg-2);transition:.15s;
}
.bridge-drop.drag{border-color:var(--brand);background:var(--brand-soft)}
.bd-ico{font-size:30px;margin-bottom:8px}
.bd-title{font-size:13px;font-weight:600;color:var(--txt-0);margin-bottom:5px}
.bd-desc{font-size:10.5px;color:var(--txt-3);line-height:1.6;margin-bottom:12px}

.ai-progress{text-align:center;padding:8px 0}
.ai-spinner{
  width:38px;height:38px;margin:0 auto 16px;border-radius:50%;
  border:3px solid var(--bg-4);border-top-color:var(--brand);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-progress-title{font-size:14px;font-weight:600;color:var(--txt-0);margin-bottom:6px}
.ai-progress-note{font-size:11px;color:var(--txt-3);line-height:1.6;margin-bottom:14px}
.ai-stream{
  text-align:left;max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  font-family:monospace;font-size:10.5px;line-height:1.6;color:var(--txt-2);
  background:var(--bg-0);border:1px solid var(--line);border-radius:8px;padding:12px;
}

</style>
</head>
<body>

<div class="app-shell">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand" id="brand">
      <div class="brand-mark">🦍</div>
      <div class="brand-text">
        <div class="brand-name">猩猩导演台</div>
        <div class="brand-sub">GORILLA STUDIO</div>
      </div>
    </div>

    <div class="project-switcher" id="projectSwitcher" title="切换项目">
      <span class="ps-dot"></span>
      <span class="ps-name" id="psName">—</span>
      <span class="ps-caret">▾</span>
      <div class="ps-menu" id="psMenu"></div>
    </div>

    <div class="topbar-spacer"></div>

    <div class="save-state" id="saveState"><span class="ss-dot"></span><span id="ssText">已保存</span></div>
    <button class="btn btn-ghost btn-sm" id="btnExportData" title="把全部项目数据导出为 JSON 备份">备份</button>
    <button class="btn btn-ghost btn-sm" id="btnImportData" title="从 JSON 备份恢复数据">恢复</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <div class="avatar" title="创作者">猩</div>
  </header>

  <!-- 主体 -->
  <div class="main-row">

    <!-- 左侧导航 -->
    <nav class="sidebar">
      <div class="nav-section-label">创作流水线</div>
      <ul class="nav-list" id="navList">
        <li class="nav-item" data-view="projects">
          <span class="nav-ico">▦</span><span class="nav-label">项目台</span><span class="nav-num" id="numProjects"></span>
        </li>
        <li class="nav-item" data-view="script">
          <span class="nav-ico">✎</span><span class="nav-label">剧本工坊</span>
        </li>
        <li class="nav-item" data-view="setup">
          <span class="nav-ico">◈</span><span class="nav-label">设定中枢</span><span class="nav-num" id="numSetup"></span>
        </li>
        <li class="nav-item" data-view="storyboard">
          <span class="nav-ico">▤</span><span class="nav-label">分镜台</span><span class="nav-num" id="numShots"></span>
        </li>
        <li class="nav-item" data-view="generate">
          <span class="nav-ico">✦</span><span class="nav-label">生成工场</span><span class="nav-num" id="numTasks"></span>
        </li>
        <li class="nav-item" data-view="edit">
          <span class="nav-ico">⏱</span><span class="nav-label">剪辑台</span>
        </li>
        <li class="nav-item" data-view="export">
          <span class="nav-ico">⇩</span><span class="nav-label">导出中心</span>
        </li>
      </ul>

      <div class="nav-section-label">资源</div>
      <ul class="nav-list">
        <li class="nav-item" data-view="assets">
          <span class="nav-ico">▣</span><span class="nav-label">资产库</span><span class="nav-num" id="numAssets"></span>
        </li>
      </ul>

      <div class="sidebar-foot">
        <div class="pipe-mini">
          <div class="pipe-mini-title">当前进度</div>
          <div class="pipe-steps" id="pipeSteps"></div>
        </div>
      </div>
    </nav>

    <!-- 工作区 -->
    <main class="workspace" id="workspace">
      <!-- 由 app.js 渲染 -->
    </main>

  </div>
</div>

<!-- 弹窗容器 -->
<div class="modal-backdrop" id="modalBackdrop" hidden style="display:none">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">标题</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- 提示容器 -->
<div class="toast-wrap" id="toastWrap"></div>

const CloudAI = (() => {
  // publicConfig（应用公开配置，发布后随站点生效；前端允许持有）
  const PUBLIC_CONFIG = {
    endpoint: 'https://gorilla-studio.app.workbuddy.host',

  };

  let cloud = null;
  let modelCache = null;
  let available = false;

  function init() {
    try {
      const SDK = window.WorkBuddyCloud;
      if (!SDK || !SDK.createWorkBuddyCloud) { available = false; return false; }
      cloud = SDK.createWorkBuddyCloud(PUBLIC_CONFIG);
      available = true;
      return true;
    } catch (e) {
      console.warn('[CloudAI] init failed', e);
      available = false;
      return false;
    }
  }

  async function models() {
    if (!available && !init()) throw new Error('AI 服务未就绪');
    if (modelCache) return modelCache;
    const list = await cloud.llm.models.list();
    modelCache = (list || []).filter(m => m.disabled !== true);
    if (!modelCache.length) throw new Error('当前没有可用的 AI 模型');
    return modelCache;
  }

  // 统一的流式收集（one-shot 也走 stream，SDK 不支持非流式）
  async function ask(systemPrompt, userPrompt, opts = {}) {
    const ms = await models();
    const model = ms.find(m => m.id === (opts.modelId || 'auto')) || ms[0];
    let out = '';
    const controller = new AbortController();
    if (opts.timeoutMs) setTimeout(() => controller.abort(), opts.timeoutMs);
    for await (const chunk of cloud.llm.chat.completions.create({
      model: model.id,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt },
      ],
      stream: true,
      temperature: opts.temperature != null ? opts.temperature : 0.8,
      signal: controller.signal,
    })) {
      const d = chunk && chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
      if (d && d.content) out += d.content;
      if (opts.onChunk) opts.onChunk(out);
    }
    return out;
  }

  // ---- 业务级生成 ----
  const SYS_SCRIPT = '你是资深短剧编剧。把给定素材改编成竖屏短剧剧本。只输出 Markdown，不要解释。格式：以「## EP001-SC001 场景名」分场景，场景内用「角色名：台词」写对白，动作用独立段落，制作标记用[画面文字]/[SFX]。开场5秒内进冲突，每场结尾留钩子。台词口语化、有地域质感，不写秒数。';

  async function generateScript(source, type, seconds, onChunk) {
    const kind = { novel: '小说', news: '新闻热点', idea: '一句话创意' }[type] || '文字素材';
    const user = `素材类型：${kind}\n目标时长：约 ${seconds || 90} 秒\n\n素材内容：\n${String(source || '').slice(0, 4000)}\n\n请改编成短剧剧本。`;

  async function generateStoryboard(scriptText, seconds, onChunk) {
    const user = `目标集长：约 ${seconds || 90} 秒\n\n剧本：\n${String(scriptText || '').slice(0, 6000)}\n\n请拆成分镜。`;
    return ask(SYS_STORYBOARD, user, { onChunk, temperature: 0.7 });

  async function generatePrompt(shot, characters, onChunk) {
    const refs = (characters || []).map(c => `${c.name}=${c.prompt || c.desc || ''}`).join('; ');

    return ask(SYS_PROMPT, user, { onChunk, temperature: 0.6 });
  }

  return {

    get available() { return available; },

  function classify(name, text) {
    const n = (name || '').toLowerCase();
    if (n.includes('配置') || n.endsWith('.json')) return 'config';
    if (/素材事实表|原始输入摘要|本集切入/.test(text)) return 'facts';
    if (/设定清单|##\s*人物[\s\S]*##\s*场景/.test(text)) return 'setup';
    if (/^##\s+SHOT-/m.test(text)) return 'storyboard';
    if (/^##\s+EP\d+-SC\d+/m.test(text)) return 'script';
    return 'unknown';
  }

  // 设定清单：人物/场景/道具
  function parseSetup(text) {
    const out = { characters: [], scenes: [], props: [] };
    let section = null;
    text.split('\n').forEach(raw => {
      const line = raw.trim();
      if (/^##\s*人物/.test(line)) { section = 'characters'; return; }
      if (/^##\s*场景/.test(line)) { section = 'scenes'; return; }
      if (/^##\s*道具/.test(line)) { section = 'props'; return; }
      if (/^##\s*造型/.test(line)) { section = null; return; }
      if (!section || !/^[-*]\s/.test(line)) return;
      const parts = splitLine(line);
      if (parts.length < 2) return;
      const [id, name, ...rest] = parts;
      const desc = rest.join(' ｜ ').replace(/^控制[：:]\s*/, '').replace(/\s*[｜|]\s*控制[：:].*$/, '').trim();
      const control = (line.match(/控制[：:]\s*([^\n]+)/) || [])[1] || '';
      if (section === 'characters') {
        out.characters.push({
          id: id.replace(/[^A-Za-z0-9_-]/g, ''), name,
          role: '', desc: desc || control, emoji: '👤',
          traits: control ? control.split(/[、,，]/).map(x => x.trim()).filter(Boolean).slice(0, 6) : [],
          prompt: `${name}, ${desc}`.slice(0, 240),
          views: { front: false, side: false, back: false },
        });
      } else if (section === 'scenes') {
        out.scenes.push({ id: id.replace(/[^A-Za-z0-9_-]/g, ''), name, desc: desc || control, prompt: `${name}, ${desc}`.slice(0, 240) });
      } else {
        out.props.push({ id: id.replace(/[^A-Za-z0-9_-]/g, ''), name, desc: desc || control });
      }
    });
    return out;
  }

  // 剧本：按 ## EP###-SC### 切场景
  function parseScript(text) {
    const blocks = text.split(/^##\s+(EP\d+-SC\d+)/m);
    const scenes = [];
    for (let i = 1; i < blocks.length; i += 2) {
      const id = blocks[i].trim();
      const body = (blocks[i + 1] || '').trim();
      const firstLine = body.split('\n')[0].trim();
      const loc = firstLine.replace(/^[内外\s·\/]+/, '').split('·').map(s => s.trim()).filter(Boolean);
      scenes.push({
        id,
        location: (loc[0] || '场景').slice(0, 24),
        time: (loc[1] || '').slice(0, 20),
        content: body,
      });
    }
    return scenes;
  }

  // 分镜：按 ## SHOT- 切镜
  function parseStoryboard(text) {
    const blocks = text.split(/^##\s+(SHOT-?[\w-]+)/mi);
    const shots = [];
    for (let i = 1; i < blocks.length; i += 2) {
      let head = blocks[i].trim();
      const body = blocks[i + 1] || '';
      if (!/^SHOT-/i.test(head)) head = 'SHOT-' + head;
      const name = (head.split('·').pop() || head).trim();
      const get = k => { const m = body.match(new RegExp('-\\s*' + k + '[：:]\\s*([^\\n]+)')); return m ? m[1].trim() : ''; };
      const durMatch = (get('时长').match(/(\d+)/) || [])[1];
      const srcLine = get('来源');
      const srId = (srcLine.match(/EP\d+-SC\d+/) || [''])[0];
      shots.push({
        id: head.replace(/[^\w-]/g, ''), name, sceneId: srId || 'EP001-SC001',
        duration: parseInt(durMatch || '3', 10),
        purpose: get('目的'), shotSize: get('景别/机位') || get('景别') || '中景',
        camera: '', movement: get('运镜') || '固定',
        start: get('起点'), action: get('动作'), end: get('终点'),
        assets: get('出场设定'), sound: get('声音'),
      });
    }
    const total = shots.reduce((a, s) => a + s.duration, 0);
    return { shots, fullTotal: total, fullCount: shots.length };
  }

  // 素材事实表：取摘要 + 核心冲突做 source
  function parseFacts(text) {
    const grab = label => {
      const m = text.match(new RegExp(label + '[：:]\\s*([^\\n]+)'));
      return m ? m[1].trim() : '';
    };
    const summary = grab('原始输入摘要') || grab('原始输入');
    const conflict = grab('核心冲突');
    return [summary, conflict].filter(Boolean).join('\n');
  }

  function parseConfig(text) {
    try {
      const j = JSON.parse(text);
      return {
        seconds: j.format?.target_seconds_per_episode || 90,
        ratio: j.format?.aspect_ratio || '9:16',
        production: j.format?.production || 'live_action',
      };
    } catch (e) { return { seconds: 90, ratio: '9:16', production: 'live_action' }; }
  }

  /**
   * 解析一批文件 {name, content}[]
   * 返回 { ok, project 片段, report }
   */
  function parseBundle(files) {
    const buckets = { config: [], facts: [], setup: [], script: [], storyboard: [], unknown: [] };
    files.forEach(f => {
      const kind = classify(f.name, f.content);
      buckets[kind].push(f);
    });

    const result = {
      script: null, setup: null, storyboard: null, config: null,
      report: [],
    };

    if (buckets.config.length) { result.config = parseConfig(buckets.config[0].content); result.report.push('✓ 配置（' + buckets.config[0].name + '）'); }
    if (buckets.facts.length) { result.factText = parseFacts(buckets.facts[0].content); result.report.push('✓ 素材事实表'); }
    if (buckets.setup.length) {
      const s = parseSetup(buckets.setup[0].content);
      if (s.characters.length || s.scenes.length || s.props.length) {
        result.setup = s;
        result.report.push(`✓ 设定清单（人物${s.characters.length}·场景${s.scenes.length}·道具${s.props.length}）`);
      }
    }
    if (buckets.script.length) {
      const scenes = parseScript(buckets.script[0].content);
      if (scenes.length) { result.scriptScenes = scenes; result.report.push(`✓ 剧本（${scenes.length} 场）`); }
    }
    if (buckets.storyboard.length) {
      const sb = parseStoryboard(buckets.storyboard[0].content);
      if (sb.shots.length) { result.storyboard = sb; result.report.push(`✓ 分镜（${sb.shots.length} 镜 · ${sb.fullTotal}s）`); }
    }
    if (buckets.unknown.length) result.report.push('○ 未识别：' + buckets.unknown.map(f => f.name).join('、'));

    result.ok = !!(result.scriptScenes || result.storyboard || result.setup);
    return result;
  }

  /** 把解析结果写入项目对象 */
  function applyToProject(p, parsed) {
    const changes = [];
    if (parsed.config) {
      p.script.targetSeconds = parsed.config.seconds;
      p.storyboard.targetSeconds = parsed.config.seconds;
      if (parsed.config.ratio) p.export.settings.ratio = parsed.config.ratio.includes('9:16') ? '9:16 竖屏' : parsed.config.ratio;
      changes.push('目标时长/画幅');
    }
    if (parsed.factText) { p.script.source = parsed.factText; changes.push('素材摘要'); }
    if (parsed.scriptScenes && parsed.scriptScenes.length) {
      p.script.scenes = parsed.scriptScenes;
      if (!p.script.title || p.script.title === '未命名') p.script.title = parsed.scriptScenes[0].id;
      changes.push('剧本场景');
    }
    if (parsed.setup) {
      if (parsed.setup.characters.length) p.setup.characters = parsed.setup.characters;
      if (parsed.setup.scenes.length) p.setup.scenes = parsed.setup.scenes;
      if (parsed.setup.props.length) p.setup.props = parsed.setup.props;
      changes.push('设定');
    }
    if (parsed.storyboard && parsed.storyboard.shots.length) {
      p.storyboard.shots = parsed.storyboard.shots;
      p.storyboard.fullTotal = parsed.storyboard.fullTotal;
      p.storyboard.fullCount = parsed.storyboard.fullCount;
      changes.push('分镜');
    }
    p.updatedAt = new Date().toISOString();
    return changes;
  }

  return { parseBundle, applyToProject, classify };
})();

</script>
<script>
/* ============================================================
   猩猩导演台 · 主应用逻辑
   ============================================================ */

(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nl2br = s => esc(s).replace(/\n/g, '<br>');
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

  let currentView = 'projects';
  let db;
  let saveTimer = null;

  const TYPE_LABEL = { novel: '小说改编', news: '新闻热点', idea: '一句话创意' };
  const VIEW_TITLE = {
    projects: ['项目台', '所有创作项目的总览。每个项目是一条从文字到成片的完整流水线。'],
    script: ['剧本工坊', '从文字素材到结构化剧本。输入小说片段、新闻或一句话，生成带场景编号的剧本正本。'],
    setup: ['设定中枢', '人物三视图、场景与道具的稳定设定，供分镜与生成引用，保证跨镜一致性。'],
    storyboard: ['分镜台', '把剧本切成逐镜画面，标注时长、景别、运镜与声音，并汇总整集时长。'],
    generate: ['生成工场', '按镜生成图片与视频的任务队列看板。原型中用模拟进度演示状态流转。'],
    edit: ['剪辑台', '时间线剪辑：片段排序、转场、字幕与配乐，所见即所得地拼成成片。'],
    export: ['导出中心', '设置分辨率、帧率与格式，生成成片并留存导出记录。'],
    assets: ['资产库', '全流程沉淀的可复用资产：角色图、场景图、视频片段与音频。']
  };

  // ============ 初始化 ============
  function init() {
    db = Store.load();
    if (window.CloudAI) CloudAI.init();
    bindGlobal();
    render();
  }

  function refresh() { db = Store.getDB(); }

  function scheduleSave() {
    setSaveState(true);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { Store.save(); setSaveState(false); }, 400);
  }
  function setSaveState(saving) {
    const el = $('#saveState');
    el.classList.toggle('saving', saving);
    $('#ssText').textContent = saving ? '保存中…' : '已保存';
  }

  // ============ 全局事件 ============
  function bindGlobal() {
    $('#navList').parentElement.addEventListener('click', e => {
      const item = e.target.closest('.nav-item');
      if (!item) return;
      currentView = item.dataset.view;
      render();
    });
    $('#brand').addEventListener('click', () => confirmReset());

    $('#projectSwitcher').addEventListener('click', e => {
      e.stopPropagation();
      $('#psMenu').classList.toggle('open');
    });
    document.addEventListener('click', () => $('#psMenu').classList.remove('open'));

    $('#btnExportData').addEventListener('click', () => {
      const blob = new Blob([Store.exportBackup()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '猩猩导演台_备份_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('已导出全部数据备份', 'ok');
    });
    $('#btnImportData').addEventListener('click', () => $('#importFile').click());
    $('#importFile').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try { Store.importBackup(r.result); refresh(); render(); toast('数据已恢复', 'ok'); }
        catch (err) { toast('恢复失败：' + err.message, 'err'); }
      };
      r.readAsText(f);
      e.target.value = '';
    });

    $('#modalClose').addEventListener('click', closeModal);
    $('#modalBackdrop').addEventListener('click', e => { if (e.target === $('#modalBackdrop')) closeModal(); });
  }

  // ============ 渲染主入口 ============
  function render() {
    refresh();
    renderTopbar();
    renderNav();
    const ws = $('#workspace');
    const map = {
      projects: viewProjects, script: viewScript, setup: viewSetup,
      storyboard: viewStoryboard, generate: viewGenerate, edit: viewEdit,
      export: viewExport, assets: viewAssets
    };
    ws.innerHTML = (map[currentView] || viewProjects)();
    ws.scrollTop = 0;
    bindViewEvents();
  }

  function renderTopbar() {
    const p = Store.activeProject();
    $('#psName').textContent = p ? p.name : '暂无项目';
  }
  function renderNav() {
    const p = Store.activeProject();
    $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === currentView));
    $('#numProjects').textContent = db.projects.length;
    $('#numSetup').textContent = p ? p.setup.characters.length + p.setup.scenes.length + p.setup.props.length : 0;
    $('#numShots').textContent = p ? p.storyboard.shots.length : 0;
    $('#numTasks').textContent = p ? p.generate.tasks.length : 0;
    $('#numAssets').textContent = p ? p.assets.length : 0;

    // 流水线进度点
    const steps = [
      { k: 'script', done: !!(p && (p.script.scenes.length || p.script.content)) },
      { k: 'setup', done: !!(p && (p.setup.characters.length || p.setup.scenes.length)) },
      { k: 'storyboard', done: !!(p && p.storyboard.shots.length) },
      { k: 'generate', done: !!(p && p.generate.tasks.length) },
      { k: 'edit', done: !!(p && p.edit.clips.length) },
      { k: 'export', done: !!(p && p.export.records.length) }
    ];
    const order = ['script', 'setup', 'storyboard', 'generate', 'edit', 'export'];
    let firstUndone = steps.findIndex(s => !s.done);
    $('#pipeSteps').innerHTML = steps.map((s, i) => {
      const isCurrent = i === firstUndone;
      const line = i < steps.length - 1 ? `<div class="pipe-line ${s.done ? 'done' : ''}"></div>` : '';
      return `<div class="pipe-step"><div class="pipe-node ${s.done ? 'done' : ''} ${isCurrent ? 'current' : ''}" title="${VIEW_TITLE[s.k][0]}">${s.done ? '✓' : '·'}</div>${line}</div>`;
    }).join('');
  }

  function headHtml(view, actions = '') {
    const [title, desc] = VIEW_TITLE[view];
    return `<div class="view-head"><div><div class="eyebrow">Gorilla Studio</div>
      <div class="view-title">${title}</div><div class="view-desc">${desc}</div></div>
      <div class="view-head-actions" id="headActions">${actions}</div></div>`;
  }

  // 无项目时的占位
  function noProject() {
    return `${headHtml(currentView)}<div class="empty"><div class="e-ico">🦍</div>
      <div class="e-title">还没有项目</div>
      <div class="e-desc">先到「项目台」新建一个项目，开启创作流水线。</div>
      <button class="btn btn-primary" data-act="goto-projects">去项目台</button></div>`;
  }

  // ============ ① 项目台 ============
  function viewProjects() {
    const totalShots = db.projects.reduce((a, p) => a + p.storyboard.shots.length, 0);
    const totalAssets = db.projects.reduce((a, p) => a + p.assets.length, 0);
    const avgProg = db.projects.length ? Math.round(db.projects.reduce((a, p) => a + Store.progress(p), 0) / db.projects.length) : 0;
    let html = headHtml('projects');
    html += `<div class="stat-row">
      ${statBox('▦', 'var(--brand)', '项目总数', db.projects.length, '个')}
      ${statBox('▤', 'var(--violet)', '分镜总数', totalShots, '镜')}
      ${statBox('▣', 'var(--teal)', '资产沉淀', totalAssets, '件')}
      ${statBox('◔', 'var(--blue)', '平均进度', avgProg, '%')}
    </div>`;
    html += `<div class="card card-pad" style="margin-bottom:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-primary" data-act="new-project">＋ 新建项目</button>
      <span style="color:var(--txt-3);font-size:11px">或从小说 / 新闻热点 / 一句话创意起步</span></div>`;

    if (!db.projects.length) {
      html += `<div class="empty"><div class="e-ico">▦</div><div class="e-title">项目台是空的</div>
        <div class="e-desc">新建一个项目，把你的想法从文字一路做到成片。</div></div>`;
      return html;
    }
    html += '<div class="grid g-4">';
    db.projects.forEach(p => {
      const prog = Store.progress(p);
      html += `<div class="proj-card" data-act="open-project" data-id="${p.id}">
        <div class="proj-cover" style="background:${p.cover}">
          <span class="pc-badge tag" style="background:rgba(0,0,0,.35);color:#fff">${TYPE_LABEL[p.type] || p.type}</span>
          ${p.emoji}
        </div>
        <div class="proj-body">
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-meta">${p.script.title !== '未命名' ? esc(p.script.title) + ' · ' : ''}更新于 ${Store.fmtTime(p.updatedAt)}</div>
          <div class="proj-progress"><div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div><span class="pct">${prog}%</span></div>
          <div class="proj-foot">
            <span class="proj-chip">✎ 剧本 ${p.script.scenes.length}</span>
            <span class="proj-chip">◈ 设定 ${p.setup.characters.length}</span>
            <span class="proj-chip">▤ 分镜 ${p.storyboard.shots.length}</span>
            <span class="proj-chip">✦ 生成 ${p.generate.tasks.length}</span>
          </div>
        </div></div>`;
    });
    html += '</div>';
    return html;
  }
  function statBox(ico, color, label, val, unit) {
    return `<div class="stat-box"><div class="stat-label"><span class="stat-ico" style="background:${color}22;color:${color}">${ico}</span>${label}</div>
      <div class="stat-val">${val}<small>${unit}</small></div></div>`;
  }

  // ============ ② 剧本工坊 ============
  function viewScript() {
    const p = Store.activeProject(); if (!p) return noProject();
    let html = headHtml('script');
    html += `<div class="script-layout">
      <div>
        <div class="card card-pad">
          <div class="card-head" style="padding:0 0 14px;margin-bottom:14px"><h3>素材输入</h3><span class="spacer"></span>
            <select class="select" id="sourceType" style="width:auto;padding:6px 28px 6px 10px">
              <option value="novel" ${p.type === 'novel' ? 'selected' : ''}>小说片段</option>
              <option value="news" ${p.type === 'news' ? 'selected' : ''}>新闻热点</option>
              <option value="idea" ${p.type === 'idea' ? 'selected' : ''}>一句话创意</option>
            </select></div>
          <div class="field"><label>把你的文字素材粘到这里</label>
            <textarea class="textarea source-area" id="sourceInput" placeholder="粘贴小说章节、新闻正文，或写下一句话创意……">${esc(p.script.source)}</textarea></div>
          <div class="script-toolbar">
            <button class="btn btn-primary btn-sm" data-act="gen-script">✎ AI 生成剧本</button>
            <button class="btn btn-ghost btn-sm" data-act="save-source">保存素材</button>
          </div>
          <div class="bridge-strip">
            <div class="bridge-strip-title">⇩ 从导演技能一键导入</div>
            <div class="bridge-strip-desc">把 script-to-screenplay 产出的 剧本.md / 分镜.md / 设定清单.md / 素材事实表.md / 配置.json 一次导入，自动归入各分区。</div>
            <button class="btn btn-outline btn-sm" data-act="bridge-import">一键导入技能产物</button>
          </div>
        </div>
        <div class="card card-pad" style="margin-top:16px">
          <div class="card-head" style="padding:0 0 12px"><h3>集参数</h3></div>
          <div class="row">
            <div class="field"><label>集名</label><input class="input" id="scriptTitle" value="${esc(p.script.title)}"></div>
            <div class="field"><label>目标时长（秒）</label><input class="input" type="number" id="targetSec" value="${p.script.targetSeconds}"></div>
          </div>
          <button class="btn btn-ghost btn-sm" data-act="save-script-meta">保存参数</button>
        </div>
      </div>
      <div>
        <div class="metric-inline">
          <div class="metric"><span class="m-lab">估时（秒）</span><span class="m-val">${p.script.estimatedSeconds || '—'}</span></div>
          <div class="metric"><span class="m-lab">对白字数</span><span class="m-val">${p.script.voicedChars || '—'}</span></div>
          <div class="metric"><span class="m-lab">场景数</span><span class="m-val">${p.script.scenes.length}</span></div>
          <div class="metric"><span class="m-lab">目标</span><span class="m-val">${p.script.targetSeconds}s</span></div>
          <div class="metric" style="margin-left:auto;justify-content:center">
            <button class="btn btn-outline btn-sm" data-act="import-script">⇩ 导入剧本</button></div>
        </div>
        <div id="scriptScenes">
          ${p.script.scenes.length ? p.script.scenes.map((s, i) => `
            <div class="scene-block">
              <div class="scene-head"><span class="scene-id">${esc(s.id)}</span>
                <span class="scene-loc">${esc(s.location)} · ${esc(s.time)}</span>
                <span class="spacer" style="flex:1"></span>
                <button class="btn btn-xs btn-ghost" data-act="edit-scene" data-i="${i}">编辑</button>
                <button class="btn btn-xs btn-danger" data-act="del-scene" data-i="${i}">删</button></div>
              <div class="scene-text">${nl2br(s.content)}</div>
            </div>`).join('') : `<div class="empty" style="padding:44px 20px"><div class="e-ico">✎</div>
              <div class="e-title">还没有剧本场景</div><div class="e-desc">在左侧输入素材生成，或从对话中导入剧本。</div></div>`}
        </div>

  // ============ 视图事件绑定（统一委托） ============
  function bindViewEvents() {
    $('#workspace').onclick = handleClick;
    $('#workspace').onchange = handleChange;
  }

  function handleChange(e) {
    const p = Store.activeProject(); if (!p) return;
    // 导出设置即时保存
    const map = { exRatio: 'ratio', exRes: 'resolution', exFps: 'fps', exFmt: 'format', exBitrate: 'bitrate' };
    if (map[e.target.id]) {
      p.export.settings[map[e.target.id]] = e.target.value.replace(' fps', '');
      scheduleSave();
    }
  }

  function handleClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const p = Store.activeProject();
    const i = el.dataset.i != null ? +el.dataset.i : null;

    // 全局类
    if (act === 'goto-projects') { currentView = 'projects'; render(); return; }
    if (act === 'new-project') { return modalNewProject(); }
    if (act === 'open-project') { Store.setActive(el.dataset.id); currentView = 'projects'; render(); toast('已切换项目', 'ok'); return; }

    if (!p) return;

    // 剧本工坊
    if (act === 'save-source') { p.script.source = $('#sourceInput').value; p.type = $('#sourceType').value; p.updatedAt = Store.now(); scheduleSave(); toast('素材已保存', 'ok'); return; }
    if (act === 'gen-script') {
      const src = $('#sourceInput').value.trim();
      if (!src) { toast('请先粘贴素材文字', 'err'); return; }
      p.script.source = src; p.type = $('#sourceType').value; scheduleSave();
      return aiGenerate('script', p, src);
    }
    if (act === 'bridge-import') { return modalBridge(p); }
    if (act === 'save-script-meta') { p.script.title = $('#scriptTitle').value; p.script.targetSeconds = +$('#targetSec').value || 90; p.storyboard.targetSeconds = p.script.targetSeconds; scheduleSave(); toast('参数已保存', 'ok'); return; }
    if (act === 'import-script') { return modalImport('剧本', txt => importScript(p, txt)); }
    if (act === 'add-scene') { return modalScene(p, null, i); }
    if (act === 'edit-scene') { return modalScene(p, i, i); }
    if (act === 'del-scene') { p.script.scenes.splice(i, 1); scheduleSave(); render(); return; }

    // 设定中枢
    if (act === 'add-char') { return modalChar(p, null); }
    if (act === 'edit-char') { return modalChar(p, i); }
    if (act === 'del-char') { p.setup.characters.splice(i, 1); scheduleSave(); render(); return; }
    if (act === 'regen-views' || act === 'gen-view') {
      const c = p.setup.characters[i];
      if (act === 'regen-views') c.views = { front: true, side: true, back: true };
      else c.views[el.dataset.v] = true;
      scheduleSave(); render(); toast('三视图已更新（原型：占位展示）', 'ok'); return;
    }
    if (act === 'add-scene-set') { return modalSceneSet(p); }
    if (act === 'del-scene-set') { p.setup.scenes.splice(i, 1); scheduleSave(); render(); return; }
    if (act === 'add-prop') { return modalProp(p); }
    if (act === 'del-prop') { p.setup.props.splice(i, 1); scheduleSave(); render(); return; }

    // 分镜台
    if (act === 'add-shot') { return modalShot(p, null); }
    if (act === 'edit-shot') { return modalShot(p, i); }
    if (act === 'del-shot') { p.storyboard.shots.splice(i, 1); scheduleSave(); render(); return; }
    if (act === 'import-storyboard') { return modalImport('分镜', txt => importStoryboard(p, txt)); }
    if (act === 'gen-storyboard') {
      if (!p.script.scenes.length) { toast('请先在剧本工坊生成或导入剧本', 'err'); return; }
      return aiGenerate('storyboard', p);
    }
    if (act === 'shot-to-gen') {
      const s = p.storyboard.shots[i];
      p.generate.tasks.unshift({ id: Store.uid('gen'), shotId: s.id, name: s.name, type: 'video', model: 'Seedance', status: 'queued', progress: 0, prompt: s.action, createdAt: Store.now() });
      scheduleSave(); toast('已加入生成工场队列（提示词可点「AI 优化」重写）', 'ok'); render(); return;
    }
    if (act === 'ai-prompt') {
      const t = p.generate.tasks.find(x => x.id === el.dataset.id);
      if (!t) return;
      return aiOptimizePrompt(p, t);
    }

    // 生成工场
    if (act === 'task-start') { const t = p.generate.tasks.find(x => x.id === el.dataset.id); t.status = 'running'; t.progress = 5; scheduleSave(); render(); return; }
    if (act === 'task-done') { const t = p.generate.tasks.find(x => x.id === el.dataset.id); t.status = 'done'; t.progress = 100; scheduleSave(); render(); toast('生成完成', 'ok'); return; }
    if (act === 'task-del') { p.generate.tasks = p.generate.tasks.filter(x => x.id !== el.dataset.id); scheduleSave(); render(); return; }
    if (act === 'task-to-asset') {
      const t = p.generate.tasks.find(x => x.id === el.dataset.id);
      p.assets.unshift({ id: Store.uid('as'), type: t.type, name: t.name, emoji: t.type === 'video' ? '🎬' : '🖼️', from: t.shotId.replace('SHOT-', 'SHOT'), time: Store.now() });
      scheduleSave(); toast('已存入资产库', 'ok'); render(); return;
    }
    if (act === 'sim-progress') {
      let changed = false;
      p.generate.tasks.forEach(t => { if (t.status === 'running') { t.progress = Math.min(100, t.progress + 20); if (t.progress >= 100) t.status = 'done'; changed = true; } });
      if (!changed) toast('没有正在生成中的任务', 'warn'); else { toast('已推进一轮进度', 'ok'); }
      scheduleSave(); render(); return;
    }
    if (act === 'new-gen-task') { return modalGenTask(p); }

    // 剪辑台
    if (act === 'play') { playPlayer(); return; }
    if (act === 'sel-clip') { $$('.tl-clip.selected').forEach(x => x.classList.remove('selected')); el.classList.add('selected'); return; }
    if (act === 'clip-up') { if (i > 0) { [p.edit.clips[i - 1], p.edit.clips[i]] = [p.edit.clips[i], p.edit.clips[i - 1]]; scheduleSave(); render(); } return; }
    if (act === 'clip-down') { if (i < p.edit.clips.length - 1) { [p.edit.clips[i + 1], p.edit.clips[i]] = [p.edit.clips[i], p.edit.clips[i + 1]]; scheduleSave(); render(); } return; }
    if (act === 'clip-del') { p.edit.clips.splice(i, 1); scheduleSave(); render(); return; }
    if (act === 'add-clip') { return modalClip(p); }
    if (act === 'toggle-sub') { p.edit.subtitles = !p.edit.subtitles; scheduleSave(); render(); return; }
    if (act === 'save-bgm') { p.edit.bgm = $('#bgmInput').value; scheduleSave(); toast('配乐已保存', 'ok'); return; }
    if (act === 'edit-to-export') { currentView = 'export'; render(); return; }

    // 导出中心
    if (act === 'do-export') {
      const s = p.export.settings;
      p.export.records.unshift({ id: Store.uid('exp'), name: `${p.script.title || 'EP001'}_v${p.export.records.length + 1}`, time: Store.now(), settings: `${s.resolution} · ${s.fps}fps · ${s.format}`, status: 'done', size: (Math.random() * 200 + 50).toFixed(0) + ' MB' });
      scheduleSave(); render(); toast('已生成导出记录（原型）', 'ok'); return;
    }
    if (act === 'del-export') { p.export.records = p.export.records.filter(x => x.id !== el.dataset.id); scheduleSave(); render(); return; }

    // 资产库
    if (act === 'asset-tab') { assetTab = el.dataset.tab; render(); return; }
  }

  function playPlayer() {
    const read = $('#timeRead'); if (!read) return;
    const p = Store.activeProject();
    const total = p.edit.clips.reduce((a, c) => a + Number(c.duration || 0), 0);
    let t = 0;
    clearInterval(playTimer);
    playTimer = setInterval(() => {

      if (read) read.textContent = `${fmtSec(Math.min(t, total))} / ${fmtSec(total)}`;
      if (t >= total) { clearInterval(playTimer); toast('播放结束', 'ok'); }
    }, 1000);

  function importScript(p, txt) {
    const parts = txt.split(/^##\s+/m).filter(Boolean);
    const scenes = [];
    parts.forEach(part => {
      const lines = part.split('\n');
      const title = lines[0].trim();
      const m = title.match(/(EP\d+-SC\d+)/);
      scenes.push({ id: m ? m[1] : 'SC' + String(scenes.length + 1).padStart(3, '0'), location: title.replace(/^EP\d+-SC\d+\s*/, '').slice(0, 20) || '场景', time: '', content: lines.slice(1).join('\n').trim() });
    });
    if (scenes.length) p.script.scenes = scenes;
  }

  function importStoryboard(p, txt) {
    const blocks = txt.split(/^##\s+SHOT-/m).slice(1);
    const shots = [];
    blocks.forEach((b, idx) => {
      const title = ('SHOT-' + b.split('\n')[0].trim()) || ('SHOT-' + (idx + 1));
      const get = k => { const m = b.match(new RegExp('- ' + k + '：([^\\n]+)')); return m ? m[1].trim() : ''; };
      const dur = parseInt((b.match(/- 时长：(\d+)s/) || [])[1] || '3', 10);
      shots.push({ id: title.replace(/[^\w-]/g, ''), name: title.split('·').pop().trim(), sceneId: (get('来源').match(/EP\d+-SC\d+/) || ['EP001-SC001'])[0], duration: dur,
        purpose: get('目的'), shotSize: get('景别/机位') || '中景', camera: get('景别/机位') || '', movement: get('运镜') || '固定',
        start: get('起点'), action: get('动作'), end: get('终点'), assets: get('出场设定'), sound: get('声音') });
    });
    if (shots.length) p.storyboard.shots = shots;
  }

      </div>`, `<button class="btn btn-ghost" data-mact="cancel">取消</button>`, false);

  async function aiGenerate(kind, p, src) {
    if (!CloudAI.available && !CloudAI.init()) {
      toast('AI 服务未就绪：请检查网络后刷新', 'err'); return;
    }
    aiBusy(kind === 'script' ? '正在改编剧本…' : '正在拆分镜…');
    const streamEl = () => $('#aiStream');
    try {
      let text = '';
      if (kind === 'script') {
        text = await CloudAI.generateScript(src, p.type, p.script.targetSeconds, partial => {
          const el = streamEl(); if (el) { el.textContent = partial.slice(-600); el.scrollTop = el.scrollHeight; }
        });
        const scenes = Bridge.parseBundle([{ name: '剧本.md', content: text }]).scriptScenes;
        if (!scenes || !scenes.length) throw new Error('AI 返回内容未能解析为剧本场景');
        p.script.scenes = scenes;
        p.script.title = p.script.title && p.script.title !== '未命名' ? p.script.title : 'AI 生成剧本';
      } else {
        const scriptText = p.script.scenes.map(s => `## ${s.id} ${s.location}\n${s.content}`).join('\n\n');
        text = await CloudAI.generateStoryboard(scriptText, p.storyboard.targetSeconds, partial => {
          const el = streamEl(); if (el) { el.textContent = partial.slice(-600); el.scrollTop = el.scrollHeight; }
        });
        const parsed = Bridge.parseBundle([{ name: '分镜.md', content: text }]).storyboard;
        if (!parsed || !parsed.shots.length) throw new Error('AI 返回内容未能解析为分镜');
        p.storyboard.shots = parsed.shots;
        p.storyboard.fullTotal = parsed.fullTotal;
        p.storyboard.fullCount = parsed.fullCount;
      }
      p.updatedAt = Store.now(); scheduleSave(); closeModal(); render();
      toast(kind === 'script' ? `已生成 ${p.script.scenes.length} 场剧本` : `已生成 ${p.storyboard.shots.length} 个镜头`, 'ok');
    } catch (e) {
      closeModal();
      const code = e && e.error && e.error.code;
      let msg = e && e.message ? e.message : '生成失败';
      if (code === 'quota_exhausted' || String(code).startsWith('quota')) msg = 'AI 额度已用完，请稍后再试或联系管理员';
      else if (String(code).startsWith('auth')) msg = 'AI 身份校验失败，请刷新页面重试';
      else if (String(code).startsWith('gateway') || String(code).startsWith('model')) msg = 'AI 服务暂时不可用，请重试';
      toast('生成失败：' + msg, 'err');
    }
  }

  async function aiOptimizePrompt(p, task) {
    if (!CloudAI.available && !CloudAI.init()) { toast('AI 服务未就绪', 'err'); return; }
    const shot = p.storyboard.shots.find(s => s.id === task.shotId) || { name: task.name, action: task.prompt };
    toast('AI 正在改写提示词…', 'ok');
    try {
      const prompt = await CloudAI.generatePrompt(shot, p.setup.characters);
      if (!prompt.trim()) throw new Error('返回为空');
      task.prompt = prompt.trim().replace(/^["「]|["」]$/g, '');
      scheduleSave(); render();
      toast('提示词已由 AI 优化', 'ok');
    } catch (e) {
      toast('AI 优化失败：' + (e && e.message ? e.message : '未知错误'), 'err');
    }
  }

  function modalBridge(p) {
    openModal('一键导入 · 导演技能产物', `
      <div class="bridge-drop" id="bridgeDrop">
        <div class="bd-ico">📥</div>
        <div class="bd-title">选择或拖入技能产出的文件</div>
        <div class="bd-desc">可多选：剧本.md · 分镜.md · 设定清单.md · 素材事实表.md · 本集配置.json</div>
        <input type="file" id="bridgeFiles" multiple accept=".md,.json,.txt" hidden>
        <button class="btn btn-outline btn-sm" id="bridgePick" type="button">选择文件</button>
      </div>
      <div class="field" style="margin-top:14px"><label>没有文件？直接粘贴多个文件内容（用文件名分隔）</label>
        <textarea class="textarea" id="bridgePaste" style="min-height:150px;font-family:monospace;font-size:11px" placeholder="==== 剧本.md ====\n# EP001 …\n\n==== 分镜.md ====\n## SHOT-EP001-001 …"></textarea></div>
      <div class="mini-note">解析器按内容特征自动识别文件类型，与文件名无关。已存在的数据会被对应产物覆盖。</div>
    `, `<button class="btn btn-ghost" data-mact="cancel">取消</button><button class="btn btn-primary" id="bridgeDo" data-mact="confirm">解析并导入</button>`, true);

    const pick = $('#bridgeFiles');
    $('#bridgePick').onclick = () => pick.click();
    const drop = $('#bridgeDrop');
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', e => { readFiles(e.dataTransfer.files); });
    pick.addEventListener('change', e => { readFiles(e.target.files); });

    const fileContents = [];
    function readFiles(fileList) {
      [...fileList].forEach(f => {
        const r = new FileReader();
        r.onload = () => {
          fileContents.push({ name: f.name, content: r.result });
          const bd = $('.bd-desc'); if (bd) bd.textContent = `已就绪 ${fileContents.length} 个文件：` + fileContents.map(x => x.name).join('、');
        };
        r.readAsText(f);
      });
    }

    // 覆盖 confirm 行为
    modalConfirm = null;
    $('#modalFoot').onclick = e => {
      const b = e.target.closest('[data-mact]'); if (!b) return;
      if (b.dataset.mact === 'cancel') { closeModal(); return; }
      if (b.id !== 'bridgeDo') return;
      let files = [...fileContents];
      const pasted = ($('#bridgePaste') || {}).value || '';
      if (pasted.trim()) {
        pasted.split(/^====\s*([^\n]+?)\s*====$/m).forEach((seg, i, arr) => {
          if (i % 2 === 1) files.push({ name: arr[i], content: arr[i + 1] || '' });
        });
        if (!files.length) files.push({ name: '粘贴内容.md', content: pasted });
      }
      if (!files.length) { toast('请先选择文件或粘贴内容', 'err'); return; }
      const parsed = Bridge.parseBundle(files);
      if (!parsed.ok) { toast('未能识别出可导入的内容，请检查文件内容', 'err'); return; }
      const changes = Bridge.applyToProject(p, parsed);
      scheduleSave(); closeModal(); render();
      toast('导入完成：' + changes.join('、'), 'ok');
    };
  }

      <div class="row"><div class="field"><label>运镜</label><input class="input" id="mHmove" value="${esc(s.movement)}"></div>
        <div class="field"><label>出场设定ID</label><input class="input" id="mHassets" value="${esc(s.assets)}"></div></div>
      <div class="field"><label>目的</label><input class="input" id="mHpurpose" value="${esc(s.purpose)}"></div>
      <div class="field"><label>起点 → 动作 → 终点</label>
        <input class="input" id="mHstart" value="${esc(s.start)}" placeholder="起点" style="margin-bottom:6px">
        <input class="input" id="mHaction" value="${esc(s.action)}" placeholder="动作" style="margin-bottom:6px">
        <input class="input" id="mHend" value="${esc(s.end)}" placeholder="终点"></div>
      <div class="field"><label>声音</label><input class="input" id="mHsound" value="${esc(s.sound)}"></div>`, '', true);
    modalConfirm = () => {
      const obj = { id: $('#mHid').value.trim() || Store.uid('SHOT'), name: $('#mHname').value.trim() || '未命名镜头', sceneId: $('#mHscene').value.trim(),
        duration: +$('#mHdur').value || 3, purpose: $('#mHpurpose').value, shotSize: $('#mHsize').value, camera: $('#mHsize').value, movement: $('#mHmove').value,
        start: $('#mHstart').value, action: $('#mHaction').value, end: $('#mHend').value, assets: $('#mHassets').value, sound: $('#mHsound').value };
      if (idx != null) p.storyboard.shots[idx] = obj; else p.storyboard.shots.push(obj);
      scheduleSave(); closeModal(); render(); toast('镜头已保存', 'ok');
    };
  }

  function modalGenTask(p) {
    openModal('新建生成任务', `
      <div class="field"><label>关联镜头</label><select class="select" id="mGshot">
        ${p.storyboard.shots.map(s => `<option value="${esc(s.id)}">${esc(s.id.replace('SHOT-', ''))} · ${esc(s.name)}</option>`).join('') || '<option value="">（暂无镜头，可手动命名）</option>'}</select></div>
      <div class="field"><label>任务名称</label><input class="input" id="mGname" placeholder="留空则取镜头名"></div>
      <div class="row"><div class="field"><label>类型</label><select class="select" id="mGtype"><option value="video">视频</option><option value="image">图片</option></select></div>
        <div class="field"><label>模型</label><select class="select" id="mGmodel"><option>Seedance</option><option>即梦</option><option>LibTV</option></select></div></div>
      <div class="field"><label>提示词</label><textarea class="textarea" id="mGprompt" style="min-height:90px"></textarea></div>`);
    modalConfirm = () => {
      const shotId = $('#mGshot').value || 'SHOT-MANUAL';
      const name = $('#mGname').value.trim() || (p.storyboard.shots.find(s => s.id === shotId)?.name || '新任务');
      p.generate.tasks.unshift({ id: Store.uid('gen'), shotId, name, type: $('#mGtype').value, model: $('#mGmodel').value, status: 'queued', progress: 0, prompt: $('#mGprompt').value, createdAt: Store.now() });
      scheduleSave(); closeModal(); render(); toast('任务已加入队列', 'ok');
    };
  }

  function modalClip(p) {
    openModal('添加剪辑片段', `
      <div class="row"><div class="field"><label>片段名称</label><input class="input" id="mCpname"></div>
        <div class="field"><label>时长（秒）</label><input class="input" type="number" id="mCpdur" value="3"></div></div>
      <div class="row"><div class="field"><label>转场</label><select class="select" id="mCptr"><option>硬切</option><option>叠化</option><option>推近</option><option>淡入</option></select></div>
        <div class="field"><label>轨道</label><select class="select" id="mCptrack"><option>V1</option><option>V2</option></select></div></div>`);
    modalConfirm = () => {
      const name = $('#mCpname').value.trim(); if (!name) { toast('请填写名称', 'err'); return; }
      const colors = ['#ff6b35', '#ff9d3d', '#9b7bff', '#5aa9ff', '#3ecfb0', '#ffc94d'];
      p.edit.clips.push({ id: Store.uid('clip'), shotId: '', name, duration: +$('#mCpdur').value || 3, color: colors[p.edit.clips.length % colors.length], track: $('#mCptrack').value, transition: $('#mCptr').value });
      scheduleSave(); closeModal(); render(); toast('片段已添加', 'ok');
    };
  }

  function confirmReset() {
    openModal('🦍 猩猩导演台',
      `<div style="text-align:center;padding:8px 0 4px">
        <div style="font-size:15px;line-height:1.8;color:var(--txt-1)">一站式短剧创作工作台<br>文字 → 剧本 → 设定 → 分镜 → 生成 → 剪辑 → 导出</div>
        <div class="divider"></div>
        <div style="text-align:left;font-size:11.5px;color:var(--txt-2);line-height:1.8">
          · 数据存在本机浏览器，自动保存<br>
          · 顶栏「备份 / 恢复」可导出或导入 JSON<br>
          · 原型中生成、渲染为模拟，实际创作在对话中完成<br>
          · 点击品牌可随时打开本说明
        </div></div>`,
      `<button class="btn btn-ghost" data-mact="cancel">关闭</button>
       <button class="btn btn-danger" data-mact="reset">重置为示例数据</button>`);
    $('#modalFoot').onclick = e => {
      const b = e.target.closest('[data-mact]'); if (!b) return;
      if (b.dataset.mact === 'cancel') closeModal();
      if (b.dataset.mact === 'reset') {
        if (confirm('确定重置？当前所有项目将被示例数据覆盖。建议先备份。')) {
          Store.resetToSeed(); closeModal(); refresh(); render(); toast('已重置为示例数据', 'ok');
        }
      }
    };
  }

  // ============ Toast ============
  function toast(msg, type = 'ok') {
    const wrap = $('#toastWrap');
    const t = document.createElement('div');
    t.className = 'toast' + (type === 'ok' ? '' : ' ' + type);
    const ico = type === 'err' ? '⛔' : type === 'warn' ? '⚠️' : '✓';
    t.innerHTML = `<span class="t-ico">${ico}</span><span>${esc(msg)}</span>`;
    wrap.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(20px)'; t.style.transition = '.3s'; }, 3200);
    setTimeout(() => t.remove(), 3600);
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
