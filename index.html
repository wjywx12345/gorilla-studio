<script>
/* ============================================================
   猩猩导演台 · 一键导入桥
   把 script-to-screenplay 技能的产物解析成导演台数据结构。
   靠内容特征自动识别文件类型，不依赖文件名。
   ============================================================ */

const Bridge = (() => {
  const splitLine = line => line.replace(/^[-*]\s*/, '').split(/[｜|]/).map(s => s.trim()).filter(Boolean);

  function classify(name, text) {
    const n = (name || '').toLowerCase();
    if (n.includes('配置') || n.endsWith('.json')) return 'config';
    if (/素材事实表|原始输入摘要|本集切入/.test(text)) return 'facts';
    if (/设定清单|##\s*人物[\s\S]*##\s*场景/.test(text)) return 'setup';
    if (/^##\s+SHOT-/m.test(text)) return 'storyboard';
    if (/^##\s+EP\d+-SC\d+/m.test(text)) return 'script';
    return 'unknown';
  }

  // 设定清单：人物/场景/道具/音色锚点
  function parseSetup(text) {
    const out = { characters: [], scenes: [], props: [], voiceAssets: [] };
    let section = null;
    text.split('\n').forEach(raw => {
      const line = raw.trim();
      if (/^##\s*人物/.test(line)) { section = 'characters'; return; }
      if (/^##\s*场景/.test(line)) { section = 'scenes'; return; }
      if (/^##\s*道具/.test(line)) { section = 'props'; return; }
      if (/^##\s*造型/.test(line)) { section = null; return; }
      if (/^##\s*音色锚点/.test(line)) { section = 'voiceAssets'; return; }
      if (!section || !/^[-*]\s/.test(line)) return;
      const parts = splitLine(line);
      if (parts.length < 2) return;
      const [id, name, ...rest] = parts;
      const desc = rest.join(' ｜ ').replace(/^控制[：:]\s*/, '').replace(/\s*[｜|]\s*控制[：:].*$/, '').trim();
      const control = (line.match(/控制[：:]\s*([^\n]+)/) || [])[1] || '';
      if (section === 'characters') {
        out.characters.push({
          id: id.replace(/[^A-Za-z0-9_-]/g, ''), name,
          role: '', desc: desc || control, emoji: '👤',
          traits: control ? control.split(/[、,，]/).map(x => x.trim()).filter(Boolean).slice(0, 6) : [],
          prompt: `${name}, ${desc}`.slice(0, 240),
          views: { front: false, side: false, back: false },
        });
      } else if (section === 'scenes') {
        out.scenes.push({ id: id.replace(/[^A-Za-z0-9_-]/g, ''), name, desc: desc || control, prompt: `${name}, ${desc}`.slice(0, 240) });
      } else if (section === 'voiceAssets') {
        const sample = (line.match(/样本[：:]\s*([^\n｜|]+)/) || [])[1] || '';
        out.voiceAssets.push({ id: id.replace(/[^A-Za-z0-9_-]/g, ''), name, desc: desc || control, sample, voiceId: '' });
      } else {
        out.props.push({ id: id.replace(/[^A-Za-z0-9_-]/g, ''), name, desc: desc || control });
      }
    });
    return out;
  }

  // 剧本：按 ## EP###-SC### 切场景
  function parseScript(text) {
    const blocks = text.split(/^##\s+(EP\d+-SC\d+)/m);
    const scenes = [];
    for (let i = 1; i < blocks.length; i += 2) {
      const id = blocks[i].trim();
      const body = (blocks[i + 1] || '').trim();
      const firstLine = body.split('\n')[0].trim();
      const loc = firstLine.replace(/^[内外\s·\/]+/, '').split('·').map(s => s.trim()).filter(Boolean);
      scenes.push({
        id,
        location: (loc[0] || '场景').slice(0, 24),
        time: (loc[1] || '').slice(0, 20),
        content: body,
      });
    }
    return scenes;
  }

  // 分镜：按 ## SHOT- 切镜
  function parseStoryboard(text) {
    const blocks = text.split(/^##\s+(SHOT-?[\w-]+)/mi);
    const shots = [];
    for (let i = 1; i < blocks.length; i += 2) {
      let head = blocks[i].trim();
      const body = blocks[i + 1] || '';
      if (!/^SHOT-/i.test(head)) head = 'SHOT-' + head;
      const name = (head.split('·').pop() || head).trim();
      const get = k => { const m = body.match(new RegExp('-\\s*' + k + '[：:]\\s*([^\\n]+)')); return m ? m[1].trim() : ''; };
      const durMatch = (get('时长').match(/(\d+)/) || [])[1];
      const srcLine = get('来源');
      const srId = (srcLine.match(/EP\d+-SC\d+/) || [''])[0];
      // AI 形态档可选字段（真人档缺这些字段也能解析，给默认值）
      const modeRaw = get('生成模式');
      const mode = /videoExtend2video/i.test(modeRaw) ? 'videoExtend2video'
        : /mixed2video/i.test(modeRaw) ? 'mixed2video' : 'text2video';
      const tailFrom = (get('衔接').match(/SHOT-?[\w-]+/i) || [''])[0].replace(/^SHOT-?/i, 'SHOT-');
      const transition = get('转场') || '硬切';
      const layered = get('声音分层');
      const soundLayers = [];
      if (layered) {
        layered.split(/[｜|]/).map(s => s.trim()).filter(Boolean).forEach((part, idx) => {
          const vm = part.match(/^([^：:]+)[：:]\s*(.*)$/);
          const label = vm ? vm[1].trim() : '';
          const text = (vm ? vm[2].trim() : part);
          if (!text || text === '无') return;
          // 音色 ID 可能写在标签里（旁白[VOICE-XXX]：台词），也可能写在文本里，两处都找
          const voiceId = (part.match(/VOICE-[\w-]+/) || [''])[0];
          const kind = /旁白|VO/i.test(label) ? 'vo' : /环境/i.test(label) ? 'ambience'
            : /音效/i.test(label) ? 'sfx' : /音乐|配乐/i.test(label) ? 'bgm' : 'ambience';
          soundLayers.push({ kind, text, voiceId, order: idx });
        });
      }
      shots.push({
        id: head.replace(/[^\w-]/g, ''), name, sceneId: srId || 'EP001-SC001',
        duration: parseInt(durMatch || '3', 10),
        purpose: get('目的'), shotSize: get('景别/机位') || get('景别') || '中景',
        camera: '', movement: get('运镜') || '固定',
        start: get('起点'), action: get('动作'), end: get('终点'),
        assets: get('出场设定'),
        sound: get('声音') || soundLayers.map(l => l.text).join('；'),
        mode, tailFrom: tailFrom || '', transition, soundLayers, segment: ''
      });
    }
    const total = shots.reduce((a, s) => a + s.duration, 0);
    return { shots, fullTotal: total, fullCount: shots.length };
  }

  // 素材事实表：取摘要 + 核心冲突做 source
  function parseFacts(text) {
    const grab = label => {
      const m = text.match(new RegExp(label + '[：:]\\s*([^\\n]+)'));
      return m ? m[1].trim() : '';
    };
    const summary = grab('原始输入摘要') || grab('原始输入');
    const conflict = grab('核心冲突');
    return [summary, conflict].filter(Boolean).join('\n');
  }

  function parseConfig(text) {
    try {
      const j = JSON.parse(text);
      return {
        seconds: j.format?.target_seconds_per_episode || 90,
        ratio: j.format?.aspect_ratio || '9:16',
        production: j.format?.production === 'ai_generated' ? 'ai_generated' : 'live_action',
      };
    } catch (e) { return { seconds: 90, ratio: '9:16', production: 'live_action' }; }
  }

  /**
   * 解析一批文件 {name, content}[]
   * 返回 { ok, project 片段, report }
   */
  function parseBundle(files) {
    const buckets = { config: [], facts: [], setup: [], script: [], storyboard: [], unknown: [] };
    files.forEach(f => {
      const kind = classify(f.name, f.content);
      buckets[kind].push(f);
    });

    const result = {
      script: null, setup: null, storyboard: null, config: null,
      report: [],
    };

    if (buckets.config.length) { result.config = parseConfig(buckets.config[0].content); result.report.push('✓ 配置（' + buckets.config[0].name + '）'); }
    if (buckets.facts.length) { result.factText = parseFacts(buckets.facts[0].content); result.report.push('✓ 素材事实表'); }
    if (buckets.setup.length) {
      const s = parseSetup(buckets.setup[0].content);
      if (s.characters.length || s.scenes.length || s.props.length) {
        result.setup = s;
        result.report.push(`✓ 设定清单（人物${s.characters.length}·场景${s.scenes.length}·道具${s.props.length}）`);
      }
    }
    if (buckets.script.length) {
      const scenes = parseScript(buckets.script[0].content);
      if (scenes.length) { result.scriptScenes = scenes; result.report.push(`✓ 剧本（${scenes.length} 场）`); }
    }
    if (buckets.storyboard.length) {
      const sb = parseStoryboard(buckets.storyboard[0].content);
      if (sb.shots.length) { result.storyboard = sb; result.report.push(`✓ 分镜（${sb.shots.length} 镜 · ${sb.fullTotal}s）`); }
    }
    if (buckets.unknown.length) result.report.push('○ 未识别：' + buckets.unknown.map(f => f.name).join('、'));

    result.ok = !!(result.scriptScenes || result.storyboard || result.setup);
    return result;
  }

  /** 把解析结果写入项目对象 */
  function applyToProject(p, parsed) {
    const changes = [];
    if (parsed.config) {
      p.script.targetSeconds = parsed.config.seconds;
      p.storyboard.targetSeconds = parsed.config.seconds;
      if (parsed.config.ratio) p.export.settings.ratio = parsed.config.ratio.includes('9:16') ? '9:16 竖屏' : parsed.config.ratio;
      if (parsed.config.production) p.production = parsed.config.production;  // 形态档开关
      changes.push('目标时长/画幅/形态');
    }
    if (parsed.factText) { p.script.source = parsed.factText; changes.push('素材摘要'); }
    if (parsed.scriptScenes && parsed.scriptScenes.length) {
      p.script.scenes = parsed.scriptScenes;
      if (!p.script.title || p.script.title === '未命名') p.script.title = parsed.scriptScenes[0].id;
      changes.push('剧本场景');
    }
    if (parsed.setup) {
      if (parsed.setup.characters.length) p.setup.characters = parsed.setup.characters;
      if (parsed.setup.scenes.length) p.setup.scenes = parsed.setup.scenes;
      if (parsed.setup.props.length) p.setup.props = parsed.setup.props;
      if (parsed.setup.voiceAssets && parsed.setup.voiceAssets.length) p.setup.voiceAssets = parsed.setup.voiceAssets;
      changes.push('设定');
    }
    if (parsed.storyboard && parsed.storyboard.shots.length) {
      p.storyboard.shots = parsed.storyboard.shots;
      p.storyboard.fullTotal = parsed.storyboard.fullTotal;
      p.storyboard.fullCount = parsed.storyboard.fullCount;
      changes.push('分镜');
    }
    p.updatedAt = new Date().toISOString();
    return changes;
  }

  return { parseBundle, applyToProject, classify };
})();

</script>
<script>
/* ============================================================
   猩猩导演台 · 分镜谱系（v2.4）
   纯派生层：节点与连线全部从 script/setup/storyboard/generate/edit/assets
   现算，绝不复制业务数据。用户只能改布局坐标，事实源仍是各分区。
   ============================================================ */
const Lineage = (() => {
  const NODE_W = 186;
  const NODE_H = 56;
  const GAP_Y = 18;
  const COLS = [
    { k: 'asset', label: '资产 / 场景 / 剧本', x: 40, color: '#3ecfb0' },
    { k: 'shot', label: '分镜', x: 300, color: '#9b7bff' },
    { k: 'task', label: '生成任务', x: 560, color: '#ff9d3d' },
    { k: 'output', label: '资产沉淀 / 成片时间线', x: 820, color: '#5aa9ff' }
  ];
  const KIND_META = {
    character: ['◈', '人物', 'asset'], scene: ['▣', '场景', 'asset'], prop: ['✦', '道具', 'asset'],
    voice: ['♪', '音色', 'asset'], script: ['✎', '剧本场景', 'asset'],
    shot: ['▤', '镜头', 'shot'], task: ['⚙', '生成', 'task'], asset: ['◆', '资产', 'output'], clip: ['▶', '时间线', 'output']
  };

  function idSet(arr) {
    const s = new Set();
    (arr || []).forEach(x => s.add(x && x.id));
    return s;
  }

  // 出场设定字段可能是 "CHAR-A,CHAR-B(右手),PROP-X"，提取其中的 ID
  function refs(text, valid) {
    return String(text || '').split(/[,，、]/).map(x => x.trim().replace(/[（(].*$/, '')).filter(x => x && valid.has(x));
  }

  function build(p) {
    const result = { nodes: [], edges: [], issues: [], health: {} };
    if (!p) return result;

    // ---- 第一遍：只建节点，不建边 ----
    const add = (id, kind, label, sub, view) => {
      if (!id) return;
      const meta = KIND_META[kind] || ['·', kind, 'asset'];
      result.nodes.push({ id, kind, col: meta[2], ico: meta[0], kindLabel: meta[1], label, sub: sub || '', view });
    };
    (p.setup.characters || []).forEach(c => add(c.id, 'character', c.name, c.role || '人物三视图', 'setup'));
    (p.setup.scenes || []).forEach(s => add(s.id, 'scene', s.name, '场景基准', 'setup'));
    (p.setup.props || []).forEach(pr => add(pr.id, 'prop', pr.name, '道具 / 核心物证', 'setup'));
    (p.setup.voiceAssets || []).forEach(v => add(v.id, 'voice', v.name, '音色锚点', 'setup'));
    (p.script.scenes || []).forEach(s => add(s.id, 'script', s.location || s.id, '剧本场景', 'script'));
    (p.storyboard.shots || []).forEach(s => add(s.id, 'shot', s.name || s.id, `${s.duration || 0}s · ${s.mode || 'text2video'}`, 'storyboard'));
    (p.generate.tasks || []).forEach(t => add(t.id, 'task', t.name || t.id, `${t.model || '—'} · ${t.status || 'queued'}`, 'generate'));
    (p.assets || []).forEach(a => add(a.id, 'asset', a.name, `${a.type || '—'} · ${a.from || ''}`, 'assets'));
    (p.edit.clips || []).forEach((c, i) => add(c.id || `clip_${i}`, 'clip', c.name || `片段 ${i + 1}`, `${c.duration || 0}s · ${c.transition || '硬切'}`, 'edit'));

    const valid = new Set(result.nodes.map(n => n.id));
    const byId = new Map(result.nodes.map(n => [n.id, n]));
    const issue = (level, node, text) => result.issues.push({ level, node, text });

    // ---- 第二遍：连线与体检（LibTV 实测的 ORPHAN_MEDIA 教训固化在这里）----
    const link = (from, to, label, kind) => {
      if (!from || !to || !valid.has(from) || !valid.has(to) || from === to) return;
      result.edges.push({ from, to, label: label || '', kind: kind || '' });
    };
    (p.storyboard.shots || []).forEach(s => {
      link(s.sceneId, s.id, '场景', 'ref');
      refs(s.assets, valid).forEach(ref => link(ref, s.id, '引用', 'ref'));
      if (s.tailFrom) {
        if (valid.has(s.tailFrom)) link(s.tailFrom, s.id, '尾帧', 'tail');
        else issue('err', s.id, `镜头「${s.name || s.id}」的尾帧衔接指向不存在的 ${s.tailFrom}`);
      }
    });
    (p.generate.tasks || []).forEach(t => {
      if (t.shotId && valid.has(t.shotId)) link(t.shotId, t.id, '生成', 'gen');
      else issue('err', t.id, `任务「${t.name || t.id}」引用了不存在的镜头 ${t.shotId || '（空）'}`);
      (t.dependsOn || []).forEach(d => link(d, t.id, '依赖', 'tail'));
    });
    (p.assets || []).forEach(a => {
      const m = String(a.from || '').match(/SHOT-[\w-]+/);
      if (m && valid.has(m[0])) link(m[0], a.id, '沉淀', 'asset');
    });
    (p.edit.clips || []).forEach((c, i) => {
      const cid = c.id || `clip_${i}`;
      if (c.shotId && valid.has(c.shotId)) link(c.shotId, cid, '入时间线', 'clip');
      else issue('warn', cid, `片段「${c.name || cid}」未关联镜头 — 它不会随镜头更新`);
    });

    const shots = p.storyboard.shots || [];
    const tasks = p.generate.tasks || [];
    const clips = p.edit.clips || [];
    const withTask = shots.filter(s => tasks.some(t => t.shotId === s.id)).length;
    const inTimeline = shots.filter(s => clips.some(c => c.shotId === s.id)).length;
    shots.forEach(s => {
      if (!tasks.some(t => t.shotId === s.id)) issue('info', s.id, `镜头「${s.name || s.id}」尚未进入生成队列`);
      if (!clips.some(c => c.shotId === s.id)) issue('warn', s.id, `镜头「${s.name || s.id}」未进时间线 — 不会出现在成片里`);
    });

    result.health = {
      shots: shots.length, withTask, inTimeline,
      percent: shots.length ? Math.round(inTimeline / shots.length * 100) : 0,
      edges: result.edges.length, nodes: result.nodes.length
    };

    // ---- 布局：已保存的坐标优先，否则按列自动排 ----
    const saved = (p.lineage && p.lineage.layout) || {};
    const counters = {};
    const pos = {};
    result.nodes.forEach(n => {
      const s = saved[n.id];
      if (s && Number.isFinite(s.x) && Number.isFinite(s.y)) pos[n.id] = { x: s.x, y: s.y };
      else {
        const i = counters[n.col] || 0;
        counters[n.col] = i + 1;
        const col = COLS.find(c => c.k === n.col) || COLS[0];
        pos[n.id] = { x: col.x, y: 56 + i * (NODE_H + GAP_Y) };
      }
    });
    result.pos = pos;
    result.width = Math.max(1120, ...result.nodes.map(n => pos[n.id].x + NODE_W + 60));
    result.height = Math.max(360, ...result.nodes.map(n => pos[n.id].y + NODE_H + 40));
    result.hidden = (p.lineage && Array.isArray(p.lineage.hidden)) ? p.lineage.hidden : [];
    return result;
  }

  function edgesSvg(data) {
    return data.edges.map(e => {
      const a = data.pos[e.from], b = data.pos[e.to];
      if (!a || !b) return '';
      if (data.hidden.includes(e.from) || data.hidden.includes(e.to)) return '';
      const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2;
      const x2 = b.x, y2 = b.y + NODE_H / 2;
      const mx = x1 + Math.max(28, (x2 - x1) / 2);
      const cls = e.kind === 'clip' ? 'clip' : e.kind === 'tail' ? 'tail' : e.kind === 'gen' ? 'gen' : '';
      return `<path class="ln-edge ${cls}" d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" marker-end="url(#lnArrow)"/>`;
    }).join('');
  }

  function nodesSvg(data) {
    return data.nodes.map(n => {
      const q = data.pos[n.id];
      if (data.hidden.includes(n.id)) return '';
      const col = COLS.find(c => c.k === n.col) || COLS[0];
      const bad = data.issues.some(i => i.node === n.id && i.level === 'warn');
      return `<g class="ln-node ${n.kind} ${bad ? 'bad' : ''}" data-node="${n.id}" transform="translate(${q.x},${q.y})">
        <rect width="${NODE_W}" height="${NODE_H}" rx="9" fill="#1d222d" stroke="${bad ? '#ffc94d' : col.color}" stroke-width="1"/>
        <rect width="4" height="${NODE_H}" rx="2" fill="${col.color}"/>
        <text class="ln-ico" x="16" y="22">${n.ico}</text>
        <text class="ln-label" x="36" y="22">${String(n.label).slice(0, 15)}</text>
        <text class="ln-sub" x="16" y="43">${String(n.sub).slice(0, 26)}</text>
        <text class="ln-kind" x="${NODE_W - 10}" y="43" text-anchor="end">${n.kindLabel}</text>
      </g>`;
    }).join('');
  }

  return { build, edgesSvg, nodesSvg, COLS, NODE_W, NODE_H };
})();

</script>
<script>
/* ============================================================
   猩猩导演台 · 电商带货反转短剧工作流（v2.4）
   一键生成一个"从一开始就为成片设计"的完整项目：
   每个镜头同时生成生成任务与剪辑片段，杜绝素材 orphan。
   注意：本文件只产出结构化数据；真实图/视频由 Agent 或外部工具生成。
   ============================================================ */
const EcomWorkflow = (() => {
  const TWISTS = {
    misread: { label: '误解反转', hook: '先让观众以为产品没用 / 要翻车，再当场打脸' },
    absurd: { label: '反常识开场', hook: '开场抛一个违反常识的结论，再逐步兑现' },
    compare: { label: '对比反转', hook: '先展示贵的 / 复杂的失败方案，再用本产品轻松解决' }
  };

  const EL = (n) => 'SHOT-EC-' + String(n).padStart(3, '0');
  const C = {
    hero: 'CHAR-EC-HERO', guest: 'CHAR-EC-GUEST', product: 'PROP-EC-PRODUCT',
    scene: 'LOC-EC-STUDIO', voice: 'VOICE-EC-HOST'
  };

  function prompt4(shot, o, characters) {
    const refs = characters.map(c => c.name + '（三视图锁定）').join('、') || '达人';
    const neg = '无水印、无多余手指、无变形产品、无乱码文字、无额外人物、不过度磨皮';
    return `[声明] 9:16 竖屏，真人带货短剧质感，人物严格参考：${refs}；产品严格参考：${o.product} 基准图；镜头同时参考分镜图与尾帧。\n`
      + `[分镜] ${shot.purpose} 景别：${shot.shotSize}，机位：${shot.camera}，运镜：${shot.movement}。起点：${shot.start} 动作：${shot.action} 终点：${shot.end}\n`
      + `[声音] ${shot.sound || ''}\n`
      + `[负面] ${neg}`;
  }

  function shot(i, name, dur, purpose, shotSize, camera, movement, start, action, end, sound, mode, tailFrom) {
    return {
      id: EL(i), name, duration: dur, sceneId: 'EC-SC-' + String(Math.min(3, Math.ceil(i / 3))).padStart(3, '0'),
      purpose, shotSize, camera, movement, start, action, end,
      assets: i <= 2 ? `${C.hero},${C.scene}` : `${C.hero},${C.product},${C.scene}`,
      sound, mode: mode || 'text2video', tailFrom: tailFrom || '',
      transition: i === 4 ? '推近' : i === 7 ? '淡出' : '硬切',
      segment: i <= 3 ? 'SEG-EC-1' : 'SEG-EC-2',
      soundLayers: [{ kind: 'dialogue', text: sound, voiceId: C.voice }]
    };
  }

  function makeShots(o) {
    const p = o.product, b = o.benefit, tw = TWISTS[o.twist] || TWISTS.misread;
    const list = [
      shot(1, '反常识钩子', 4, `用一句反常识的话抓住前 3 秒停留：${tw.hook}`,
        '近景直视镜头', '正对镜头，浅景深', '轻微推',
        '达人顶着没打理的头发直视镜头', `达人抬手制止：别急着洗，先看完这 4 秒`, '定格在认真表情',
        `达人：别再乱折腾了，今天教你一招。`),
      shot(2, '痛点具象', 4, '让目标人群一眼对号入座：把痛点拍成可见的身体细节',
        '特写→中景', '顶光侧拍', '固定',
        '发根扁塌贴头皮的特写', '同事从背后经过，达人下意识低头', '达人对镜苦笑',
        `达人：${o.audience}最怕的不是油，是塌。`),
      shot(3, '误导铺垫', 5, '故意让观众误判：以为又是一个没用的道具',
        '中景', '桌面俯拍', '横移',
        '达人把产品放在桌上，表情敷衍', '旁白式吐槽：这东西真能行？达人转身要走', '产品静静留在画面中央',
        '达人（迟疑）：这个……能有用吗？', 'mixed2video', EL(2)),
      shot(4, '反转兑现', 5, '反转核心：误判被当场推翻，效果必须肉眼可见',
        '近景→特写', '正面平视', '快速推近',
        '达人回头，拿起产品', `几下操作后发根立起，达人表情从怀疑变惊喜`, '定格在蓬松发根',
        `达人：等等——${b}。`, 'mixed2video', EL(3)),
      shot(5, '证据特写', 5, '给可验证证据：动作细节 + 前后对比，拒绝空口承诺',
        '极特写', '柔光侧逆', '缓慢推',
        '产品齿面与发根接触的极特写', '慢动作展示操作路径，画面分出使用前 / 使用后', '对比画面定格 0.5 秒',
        '音效：轻柔摩擦声；画面文字：使用前 / 使用后', 'mixed2video', EL(4)),
      shot(6, '社会认同', 4, '第三方反应替代自夸，提升可信度',
        '双人中景', '过肩侧拍', '固定',
        '另一位人物走近', `伸手摸了一下头发，点头露出惊讶表情`, '两人相视一笑',
        `客人：哎？真的不一样。`, 'text2video', EL(5)),
      shot(7, '行动指令', 3, '一句话 CTA：明确动作 + 记忆点，不堆卖点',
        '产品特写+人物半身', '正面', '固定',
        '产品与达人在同一画面', `达人举起产品：${p}，就这一下`, '品牌色背景收尾',
        `达人：想试的，点开下方，今天这个价。`, 'text2video', EL(6))
    ];
    return list;
  }

  function create(o) {
    o = o || {};
    const opt = {
      product: (o.product || '蓬松发梳').trim(),
      benefit: (o.benefit || '摇两下头发就不油').trim(),
      audience: (o.audience || '上班族').trim(),
      twist: TWISTS[o.twist] ? o.twist : 'misread',
      tone: (o.tone || '轻松幽默').trim(),
      brandColor: /^#[0-9a-fA-F]{6}$/.test(o.brandColor || '') ? o.brandColor : '#ff6b35'
    };
    const t = Date.now();
    const shots = makeShots(opt);
    const characters = [
      { id: C.hero, name: '达人', role: '主角 · 产品演示者', emoji: '🙂',
        desc: `${opt.audience}形象，真实不端着，表情从怀疑到惊喜的转变要清楚。`,
        traits: ['可辨识发型', '固定上衣颜色', '自然妆容'], views: { front: true, side: true, back: true },
        prompt: `Chinese lifestyle host, ${opt.audience}, authentic expression, consistent hairstyle and top color across all shots, 3-view character sheet` },
      { id: C.guest, name: '同事', role: '配角 · 第三方见证', emoji: '🧑‍💼',
        desc: '路人同事，反应真实克制，用一个动作一个点头完成社会认同。',
        traits: ['通勤着装', '短发'], views: { front: true, side: false, back: false },
        prompt: 'Chinese office colleague, commuter outfit, short hair, genuine subtle surprised reaction' }
    ];
    const props = [
      { id: C.product, name: opt.product, desc: `核心产品。所有镜头必须外观一致：${opt.benefit}。生成时以基准图为唯一参考，禁止形变。` },
      { id: 'PROP-EC-CARD', name: '前后对比卡', desc: '第 5 镜证据画面使用，画面文字固定为「使用前 / 使用后」。' }
    ];
    const tasks = shots.map((s, i) => ({
      id: 'gen_ec_' + (i + 1) + '_' + t.toString(36),
      shotId: s.id, name: s.name, type: 'video', model: i === 5 ? '即梦' : 'Seedance',
      status: 'queued', progress: 0, prompt: prompt4(s, opt, characters), createdAt: new Date(t).toISOString(),
      mode: s.mode, tailFrom: s.tailFrom, dependsOn: s.tailFrom ? [s.tailFrom] : [], transition: s.transition
    }));
    const colors = ['#ff6b35', '#ff9d3d', '#9b7bff', '#5aa9ff', '#3ecfb0', '#ffc94d', '#ff8a5b'];
    const clips = shots.map((s, i) => ({
      id: 'clip_ec_' + (i + 1) + '_' + t.toString(36), shotId: s.id, name: s.name,
      duration: s.duration, color: colors[i % colors.length], track: 'V1', transition: s.transition
    }));
    const scenes = [
      { id: 'EC-SC-001', location: '达人近景位', time: '白天', content: '钩子、痛点与误导：固定机位，靠表演和景别制造误判。' },
      { id: 'EC-SC-002', location: '产品操作位', time: '接前场', content: '反转与证据：必须锁产品外观，慢镜与对比卡承担说服力。' },
      { id: 'EC-SC-003', location: '双人见证位', time: '接前场', content: '社会认同与 CTA：第三方反应 + 一句话行动指令。' }
    ];

    return {
      id: 'proj_ec_' + t.toString(36),
      name: `${opt.product} · 反转带货短剧`,
      type: 'idea', emoji: '🛍️',
      cover: `linear-gradient(135deg,${opt.brandColor},#1f2937)`,
      createdAt: new Date(t).toISOString(), updatedAt: new Date(t).toISOString(),
      production: 'ai_generated',
      script: {
        source: `产品：${opt.product}\n核心卖点：${opt.benefit}\n目标人群：${opt.audience}\n反转类型：${TWISTS[opt.twist].label}（${TWISTS[opt.twist].hook}）\n调性：${opt.tone}`,
        title: `${opt.product} · 30 秒反转带货`,
        targetSeconds: 30, estimatedSeconds: 30, voicedChars: 0, scenes
      },
      setup: {
        characters,
        scenes: [{ id: C.scene, name: '室内固定机位', desc: '干净背景，柔光，品牌色点缀；全片光向一致。', prompt: 'clean indoor studio, soft even light, subtle brand color accent, consistent lighting direction' }],
        props,
        voiceAssets: [{ id: C.voice, name: '达人音色', desc: `真实自然的${opt.tone}语气，前 3 秒语速略快，反转后放慢。`, sample: '8s 干净人声样本', voiceId: '' }]
      },
      storyboard: {
        targetSeconds: 30, shots, fullTotal: 30, fullCount: shots.length,
        segments: [
          { id: 'SEG-EC-1', name: '片段一·钩子与误导', shotIds: shots.slice(0, 3).map(s => s.id) },
          { id: 'SEG-EC-2', name: '片段二·反转与转化', shotIds: shots.slice(3).map(s => s.id) }
        ]
      },
      generate: { tasks },
      versions: [{ id: 'ver_ec_base', name: '结构版 v1', note: '七镜结构已锁定；生成任务与剪辑片段已预建，素材回填后即可出片。', time: new Date(t).toISOString(), snapshot: null }],
      edit: {
        audioTracks: [
          { id: 'AUD-VO', name: '旁白/音色', kind: 'vo', items: shots.map(s => ({ id: 'aud_' + s.id, name: s.name, voiceId: C.voice, text: s.sound, duration: s.duration, source: s.id })) },
          { id: 'AUD-BGM', name: '配乐', kind: 'bgm', items: [{ id: 'aud_bgm_ec', name: '轻快节奏 · 前疏后密', voiceId: '', text: '', duration: 30, source: '音效库' }] },
          { id: 'AUD-SFX', name: '音效', kind: 'sfx', items: [{ id: 'aud_sfx_ec', name: '第 5 镜摩擦声 + 反转提示音', voiceId: '', text: '', duration: 5, source: '音效库' }] }
        ],
        clips, subtitles: true, bgm: '轻快节奏 · 前疏后密'
      },
      export: {
        settings: { resolution: '1080×1920', fps: '30', format: 'MP4', bitrate: '高', ratio: '9:16 竖屏' },
        pipeline: { removeSubtitle: true, compose: true, upscale: false, upscaleTo: '1080P' }, records: []
      },
      assets: [
        { id: 'as_ec_hero', type: 'image', name: '达人 · 三视图基准', emoji: '🙂', from: '设定中枢', time: new Date(t).toISOString(), shotId: '' },
        { id: 'as_ec_product', type: 'image', name: `${opt.product} · 基准图`, emoji: '🛍️', from: '设定中枢', time: new Date(t).toISOString(), shotId: '' }
      ],
      lineage: { layout: {}, hidden: [] },
      ecom: {
        template: 'ecom-reversal-v1', createdAt: new Date(t).toISOString(),
        product: opt.product, benefit: opt.benefit, audience: opt.audience, twist: opt.twist, tone: opt.tone, brandColor: opt.brandColor,
        gates: [
          { id: 'G1', text: '前 3 秒钩子已写明反常识结论', done: true },
          { id: 'G2', text: '达人 / 产品基准图已锁定（三视图 + 外观一致）', done: false },
          { id: 'G3', text: '七镜全部有生成任务与剪辑片段', done: true },
          { id: 'G4', text: '第 5 镜证据可验证（前后对比可见）', done: true },
          { id: 'G5', text: '素材已回填到 素材/<镜号>.mp4', done: false },
          { id: 'G6', text: '本地出片脚本已合成 MP4 并抽帧审片', done: false }
        ]
      }
    };
  }

  return { create, TWISTS, C };
})();

</script>
<script>
/* ============================================================
   猩猩导演台 · 主应用逻辑
   ============================================================ */

(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nl2br = s => esc(s).replace(/\n/g, '<br>');
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

  let currentView = 'projects';
  let db;
  let saveTimer = null;

  const TYPE_LABEL = { novel: '小说改编', news: '新闻热点', idea: '一句话创意' };
  const VIEW_TITLE = {
    projects: ['项目台', '所有创作项目的总览。每个项目是一条从文字到成片的完整流水线。'],
    script: ['剧本工坊', '从文字素材到结构化剧本。输入小说片段、新闻或一句话，生成带场景编号的剧本正本。'],
    setup: ['设定中枢', '人物三视图、音色锚点、场景与道具的稳定设定，供分镜与生成引用，保证跨镜一致性。'],
    storyboard: ['分镜台', '按形态档切镜：真人快切或 AI 长镜溶接；标注模式、尾帧衔接、声音分层并汇总时长。'],
    generate: ['生成工场', '按镜生成的任务看板，支持 text2video / mixed2video / videoExtend2video 接力与尾帧衔接。'],
    edit: ['剪辑台', '时间线剪辑：片段排序、转场、字幕，以及旁白/配乐/音效三条独立音轨。'],
    export: ['导出中心', '设置分辨率帧率，执行去字幕→合成→放大后期工序，留存导出记录。'],
    assets: ['资产库', '全流程沉淀的可复用资产：角色图、场景图、视频片段与音频。'],
    lineage: ['谱系视图', '从现有数据自动生成的资产→分镜→生成→成片关系图。节点只表达引用，拖动只改布局，不产生第二份数据。']
  };

  // ============ 初始化 ============
  function init() {
    db = Store.load();
    if (window.CloudAI) CloudAI.init();
    bindGlobal();
    render();
  }

  function refresh() { db = Store.getDB(); }

  function scheduleSave() {
    setSaveState(true);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { Store.save(); setSaveState(false); }, 400);
  }
  function setSaveState(saving) {
    const el = $('#saveState');
    el.classList.toggle('saving', saving);
    $('#ssText').textContent = saving ? '保存中…' : '已保存';
  }

  // ============ 全局事件 ============
  function bindGlobal() {
    $('#navList').parentElement.addEventListener('click', e => {
      const item = e.target.closest('.nav-item');
      if (!item) return;
      currentView = item.dataset.view;
      render();
    });
    $('#brand').addEventListener('click', () => confirmReset());

    $('#projectSwitcher').addEventListener('click', e => {
      e.stopPropagation();
      const item = e.target.closest('[data-act]');
      if (item) {
        const act = item.dataset.act;
        $('#psMenu').classList.remove('open');
        if (act === 'switch-project') {
          Store.setActive(item.dataset.id); currentView = 'projects'; render(); toast('已切换项目', 'ok');
        } else if (act === 'new-project') {
          modalNewProject();
        } else if (act === 'edit-project') {
          modalEditProject(item.dataset.id);
        } else if (act === 'del-project') {
          modalDelProject(item.dataset.id);
        }
        return;
      }
      $('#psMenu').classList.toggle('open');
    });
    document.addEventListener('click', () => $('#psMenu').classList.remove('open'));

    $('#btnExportData').addEventListener('click', () => {
      const blob = new Blob([Store.exportBackup()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '猩猩导演台_备份_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('已导出全部数据备份', 'ok');
    });
    $('#btnImportData').addEventListener('click', () => $('#importFile').click());
    $('#importFile').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try { Store.importBackup(r.result); refresh(); render(); toast('数据已恢复', 'ok'); }
        catch (err) { toast('恢复失败：' + err.message, 'err'); }
      };
      r.readAsText(f);
      e.target.value = '';
    });

    $('#modalClose').addEventListener('click', closeModal);
    $('#modalBackdrop').addEventListener('click', e => { if (e.target === $('#modalBackdrop')) closeModal(); });
  }

  // ============ 渲染主入口 ============
  function render() {
    refresh();
    renderTopbar();
    renderNav();
    const ws = $('#workspace');
    const map = {
      projects: viewProjects, script: viewScript, setup: viewSetup,
      storyboard: viewStoryboard, generate: viewGenerate, edit: viewEdit,
      export: viewExport, assets: viewAssets, lineage: viewLineage
    };
    ws.innerHTML = (map[currentView] || viewProjects)();
    ws.scrollTop = 0;
    bindViewEvents();
  }

  function renderTopbar() {
    const p = Store.activeProject();
    $('#psName').textContent = p ? p.name : '暂无项目';
    // 填充项目切换下拉（此前只 toggle 空菜单，导致点击无反应）
    const menu = $('#psMenu');
    if (menu) {
      const activeId = p ? p.id : null;
      let mh = db.projects.map(item =>
        `<div class="ps-menu-item ${item.id === activeId ? 'active' : ''}" data-act="switch-project" data-id="${item.id}">
          <span class="pmi-emoji">${item.emoji || '▦'}</span>
          <span class="pmi-name">${esc(item.name)}</span>
          <button class="pmi-op" data-act="edit-project" data-id="${item.id}" title="重命名 / 换图标">✎</button>
          <button class="pmi-op pmi-op-del" data-act="del-project" data-id="${item.id}" title="删除项目">✕</button>
          ${item.id === activeId ? '<span class="pmi-check">✓</span>' : ''}
        </div>`).join('');
      mh += `<div class="ps-menu-sep"></div>
        <div class="ps-menu-item" data-act="new-project"><span class="pmi-emoji">＋</span><span class="pmi-name">新建项目</span></div>`;
      menu.innerHTML = mh;
    }
  }
  function renderNav() {
    const p = Store.activeProject();
    $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === currentView));
    $('#numProjects').textContent = db.projects.length;
    $('#numSetup').textContent = p ? p.setup.characters.length + p.setup.scenes.length + p.setup.props.length : 0;
    $('#numShots').textContent = p ? p.storyboard.shots.length : 0;
    $('#numTasks').textContent = p ? p.generate.tasks.length : 0;
    $('#numAssets').textContent = p ? p.assets.length : 0;

    // 流水线进度点
    const steps = [
      { k: 'script', done: !!(p && (p.script.scenes.length || p.script.content)) },
      { k: 'setup', done: !!(p && (p.setup.characters.length || p.setup.scenes.length)) },
      { k: 'storyboard', done: !!(p && p.storyboard.shots.length) },
      { k: 'generate', done: !!(p && p.generate.tasks.length) },
      { k: 'edit', done: !!(p && p.edit.clips.length) },
      { k: 'export', done: !!(p && p.export.records.length) }
    ];
    const order = ['script', 'setup', 'storyboard', 'generate', 'edit', 'export'];
    let firstUndone = steps.findIndex(s => !s.done);
    $('#pipeSteps').innerHTML = steps.map((s, i) => {
      const isCurrent = i === firstUndone;
      const line = i < steps.length - 1 ? `<div class="pipe-line ${s.done ? 'done' : ''}"></div>` : '';
      return `<div class="pipe-step"><div class="pipe-node ${s.done ? 'done' : ''} ${isCurrent ? 'current' : ''}" title="${VIEW_TITLE[s.k][0]}">${s.done ? '✓' : '·'}</div>${line}</div>`;
    }).join('');
  }

  function headHtml(view, actions = '') {
    const [title, desc] = VIEW_TITLE[view];
    return `<div class="view-head"><div><div class="eyebrow">Gorilla Studio</div>
      <div class="view-title">${title}</div><div class="view-desc">${desc}</div></div>
      <div class="view-head-actions" id="headActions">${actions}</div></div>`;
  }

  // 无项目时的占位
  function noProject() {
    return `${headHtml(currentView)}<div class="empty"><div class="e-ico">🦍</div>
      <div class="e-title">还没有项目</div>
      <div class="e-desc">先到「项目台」新建一个项目，开启创作流水线。</div>
      <button class="btn btn-primary" data-act="goto-projects">去项目台</button></div>`;
  }

  // ============ ① 项目台 ============
  function viewProjects() {
    const totalShots = db.projects.reduce((a, p) => a + p.storyboard.shots.length, 0);
    const totalAssets = db.projects.reduce((a, p) => a + p.assets.length, 0);
    const avgProg = db.projects.length ? Math.round(db.projects.reduce((a, p) => a + Store.progress(p), 0) / db.projects.length) : 0;
    let html = headHtml('projects');
    html += `<div class="stat-row">
      ${statBox('▦', 'var(--brand)', '项目总数', db.projects.length, '个', 'projects')}
      ${statBox('▤', 'var(--violet)', '分镜总数', totalShots, '镜', 'storyboard')}
      ${statBox('▣', 'var(--teal)', '资产沉淀', totalAssets, '件', 'assets')}
      ${statBox('◔', 'var(--blue)', '平均进度', avgProg, '%', 'script')}
    </div>`;
    html += `<div class="card card-pad" style="margin-bottom:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-primary" data-act="new-project">＋ 新建项目</button>
      <button class="btn btn-outline ecom-cta" data-act="new-ecom">⚡ 一键生成电商带货工作流</button>
      <span style="color:var(--txt-3);font-size:11px">或从小说 / 新闻热点 / 一句话创意起步 · 电商模板预建七镜 + 生成任务 + 时间线，结构即可出片</span></div>`;

    if (!db.projects.length) {
      html += `<div class="empty"><div class="e-ico">▦</div><div class="e-title">项目台是空的</div>
        <div class="e-desc">新建一个项目，把你的想法从文字一路做到成片。</div></div>`;
      return html;
    }
    html += '<div class="grid g-4">';
    db.projects.forEach(p => {
      const prog = Store.progress(p);
      html += `<div class="proj-card" data-act="open-project" data-id="${p.id}">
        <div class="proj-cover" style="background:${p.cover}">
          <span class="pc-badge tag" style="background:rgba(0,0,0,.35);color:#fff">${TYPE_LABEL[p.type] || p.type}</span>
          <div class="pc-ops">
            <button class="pc-op" data-act="edit-project" data-id="${p.id}" title="重命名 / 换图标">✎</button>
            <button class="pc-op pc-op-del" data-act="del-project" data-id="${p.id}" title="删除项目">✕</button>
          </div>
          ${p.emoji}
        </div>
        <div class="proj-body">
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-meta">${p.script.title !== '未命名' ? esc(p.script.title) + ' · ' : ''}更新于 ${Store.fmtTime(p.updatedAt)}</div>
          <div class="proj-progress"><div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div><span class="pct">${prog}%</span></div>
          <div class="proj-foot">
            <span class="proj-chip proj-chip-btn" data-act="proj-goto" data-id="${p.id}" data-view="script" title="进入剧本工坊">✎ 剧本 ${p.script.scenes.length}</span>

  function viewGenerate() {

      html += `<div class="kb-col"><div class="kb-head"><span class="kb-dot" style="background:${col.color}"></span>

      tasks.forEach(t => {

        html += `<div class="gen-card"><div class="gen-card-top">

          <div style="flex:1;min-width:0"><div class="gen-name">${esc(t.name)}</div>

          ${t.status === 'queued' ? `<button class="btn btn-xs btn-primary" data-act="task-start" data-id="${t.id}">开始</button>` : ''}
          ${t.status === 'running' ? `<button class="btn btn-xs btn-outline" data-act="task-done" data-id="${t.id}">标记完成</button>` : ''}

    html += '</div>';

  function bindLineageDrag() {
    const svg = $('#lnSvg'); if (!svg) return;
    const p = Store.activeProject(); if (!p) return;
    const d = Lineage.build(p);
    const pos = d.pos;
    let drag = null;
    const point = e => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const m = svg.getScreenCTM(); if (!m) return { x: 0, y: 0 };
      const r = pt.matrixTransform(m.inverse()); return { x: r.x, y: r.y };
    };
    svg.addEventListener('pointerdown', e => {
      const g = e.target.closest('[data-node]'); if (!g) return;
      e.preventDefault();
      const id = g.dataset.node, q = pos[id]; if (!q) return;
      const pt = point(e);
      drag = { id, g, ox: pt.x - q.x, oy: pt.y - q.y, moved: false };
      try { g.setPointerCapture(e.pointerId); } catch (_) {}
    });
    svg.addEventListener('pointermove', e => {
      if (!drag) return;
      const pt = point(e);
      const x = Math.max(8, Math.round(pt.x - drag.ox)), y = Math.max(8, Math.round(pt.y - drag.oy));
      pos[drag.id] = { x, y };
      drag.g.setAttribute('transform', `translate(${x},${y})`);
      const eg = $('#lnEdges'); if (eg) eg.innerHTML = Lineage.edgesSvg({ ...d, pos });
      drag.moved = true;
    });
    const finish = () => {
      if (!drag) return;
      if (drag.moved) {
        Store.saveLineageLayout(p.id, pos, d.hidden);
        toast('布局已保存（仅坐标，业务数据未改动）', 'ok');
      } else {
        const node = d.nodes.find(n => n.id === drag.id);
        if (node && VIEW_TITLE[node.view]) { currentView = node.view; render(); }
      }
      drag = null;
    };
    svg.addEventListener('pointerup', finish);
    svg.addEventListener('pointercancel', finish);
  }

  // ============ 视图事件绑定（统一委托） ============
  function bindViewEvents() {
    $('#workspace').onclick = handleClick;
    $('#workspace').onchange = handleChange;
    if (currentView === 'lineage') bindLineageDrag();
  }

  function handleChange(e) {
    const p = Store.activeProject(); if (!p) return;
    // 导出设置即时保存
    const map = { exRatio: 'ratio', exRes: 'resolution', exFps: 'fps', exFmt: 'format', exBitrate: 'bitrate' };
    if (map[e.target.id]) {
      p.export.settings[map[e.target.id]] = e.target.value.replace(' fps', '');
      scheduleSave();
      return;
    }
    // 后期工序勾选 / 放大档位
    const t = e.target;
    if (t.dataset && t.dataset.act === 'pipeline-toggle') {
      Store.updatePipeline(p.id, { [t.dataset.key]: t.checked });
      scheduleSave(); toast('后期工序已更新', 'ok'); return;
    }
    if (t.dataset && t.dataset.act === 'pipeline-upscale') {
      Store.updatePipeline(p.id, { upscale: true, upscaleTo: t.value });
      scheduleSave(); toast('放大档位：' + t.value, 'ok'); return;
    }
  }

  function handleClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const p = Store.activeProject();
    const i = el.dataset.i != null ? +el.dataset.i : null;

    // 全局类
    if (act === 'goto-view') { const v = el.dataset.view; if (v) { currentView = v; render(); } return; }
    if (act === 'goto-projects') { currentView = 'projects'; render(); return; }
    if (act === 'new-project') { return modalNewProject(); }
    if (act === 'new-ecom') { return modalEcom(); }
    if (act === 'edit-project') { return modalEditProject(el.dataset.id); }
    if (act === 'del-project') { return modalDelProject(el.dataset.id); }
    if (act === 'switch-project' || act === 'open-project') {
      Store.setActive(el.dataset.id); currentView = 'projects'; render(); toast('已切换项目', 'ok'); return;
    }
    if (act === 'proj-goto') {
      const pid = el.dataset.id, v = el.dataset.view;
      if (pid) Store.setActive(pid);
      if (v && VIEW_TITLE[v]) currentView = v;
      render(); return;
    }

    if (!p) return;

    // 剧本工坊
    if (act === 'save-source') { p.script.source = $('#sourceInput').value; p.type = $('#sourceType').value; p.updatedAt = Store.now(); scheduleSave(); toast('素材已保存', 'ok'); return; }
    if (act === 'gen-script') {
      const src = $('#sourceInput').value.trim();
      if (!src) { toast('请先粘贴素材文字', 'err'); return; }
      p.script.source = src; p.type = $('#sourceType').value; scheduleSave();
      return aiGenerate('script', p, src);
    }
    if (act === 'bridge-import') { return modalBridge(p); }
    if (act === 'save-script-meta') {
      p.script.title = $('#scriptTitle').value;
      p.script.targetSeconds = +$('#targetSec').value || 90;
      p.storyboard.targetSeconds = p.script.targetSeconds;
      const prodSel = $('#productionSel');
      if (prodSel) { p.production = prodSel.value; Store.updateProject(p.id, { production: p.production }); }
      scheduleSave(); toast('参数已保存' + (prodSel ? '（形态：' + (p.production === 'ai_generated' ? 'AI 长镜' : '真人快切') + '）' : ''), 'ok'); return;
    }
    if (act === 'import-script') { return modalImport('剧本', txt => importScript(p, txt)); }
    if (act === 'add-scene') { return modalScene(p, null, i); }
    if (act === 'edit-scene') { return modalScene(p, i, i); }
    if (act === 'del-scene') { p.script.scenes.splice(i, 1); scheduleSave(); render(); return; }

    // 设定中枢
    if (act === 'add-char') { return modalChar(p, null); }
    if (act === 'edit-char') { return modalChar(p, i); }
    if (act === 'del-char') { p.setup.characters.splice(i, 1); scheduleSave(); render(); return; }
    if (act === 'regen-views' || act === 'gen-view') {
      const c = p.setup.characters[i];
      if (act === 'regen-views') c.views = { front: true, side: true, back: true };
      else c.views[el.dataset.v] = true;
      scheduleSave(); render(); toast('三视图已更新（原型：占位展示）', 'ok'); return;
    }
    if (act === 'add-scene-set') { return modalSceneSet(p); }
    if (act === 'del-scene-set') { p.setup.scenes.splice(i, 1); scheduleSave(); render(); return; }
    if (act === 'add-prop') { return modalProp(p); }
    if (act === 'del-prop') { p.setup.props.splice(i, 1); scheduleSave(); render(); return; }
    if (act === 'add-voice') { return modalVoice(p); }
    if (act === 'del-voice') { p.setup.voiceAssets.splice(i, 1); scheduleSave(); render(); return; }

    // 分镜台
    if (act === 'add-shot') { return modalShot(p, null); }
    if (act === 'edit-shot') { return modalShot(p, i); }
    if (act === 'del-shot') { p.storyboard.shots.splice(i, 1); scheduleSave(); render(); return; }
    if (act === 'import-storyboard') { return modalImport('分镜', txt => importStoryboard(p, txt)); }
    if (act === 'gen-storyboard') {
      if (!p.script.scenes.length) { toast('请先在剧本工坊生成或导入剧本', 'err'); return; }
      return aiGenerate('storyboard', p);
    }
    if (act === 'shot-to-gen') {
      const s = p.storyboard.shots[i];
      p.generate.tasks.unshift({ id: Store.uid('gen'), shotId: s.id, name: s.name, type: 'video', model: 'Seedance', status: 'queued', progress: 0, prompt: s.action, createdAt: Store.now(),
        mode: s.mode || 'text2video', tailFrom: s.tailFrom || '', dependsOn: s.tailFrom ? [s.tailFrom] : [], transition: s.transition || '硬切' });
      scheduleSave(); toast('已加入生成工场队列（提示词可点「AI 优化」重写）', 'ok'); render(); return;
    }
    if (act === 'ai-prompt') {
      const t = p.generate.tasks.find(x => x.id === el.dataset.id);
      if (!t) return;
      return aiOptimizePrompt(p, t);
    }

    // 生成工场
    if (act === 'task-start') { const t = p.generate.tasks.find(x => x.id === el.dataset.id); t.status = 'running'; t.progress = 5; scheduleSave(); render(); return; }
    if (act === 'task-done') { const t = p.generate.tasks.find(x => x.id === el.dataset.id); t.status = 'done'; t.progress = 100; scheduleSave(); render(); toast('生成完成', 'ok'); return; }
    if (act === 'task-del') { p.generate.tasks = p.generate.tasks.filter(x => x.id !== el.dataset.id); scheduleSave(); render(); return; }
    if (act === 'task-to-asset') {
      const t = p.generate.tasks.find(x => x.id === el.dataset.id);
      p.assets.unshift({ id: Store.uid('as'), type: t.type, name: t.name, emoji: t.type === 'video' ? '🎬' : '🖼️', from: t.shotId.replace('SHOT-', 'SHOT'), time: Store.now() });
      scheduleSave(); toast('已存入资产库', 'ok'); render(); return;
    }
    if (act === 'sim-progress') {
      let changed = false;
      p.generate.tasks.forEach(t => { if (t.status === 'running') { t.progress = Math.min(100, t.progress + 20); if (t.progress >= 100) t.status = 'done'; changed = true; } });
      if (!changed) toast('没有正在生成中的任务', 'warn'); else { toast('已推进一轮进度', 'ok'); }
      scheduleSave(); render(); return;
    }
    if (act === 'new-gen-task') { return modalGenTask(p); }

    // 剪辑台
    if (act === 'play') { playPlayer(); return; }
    if (act === 'sel-clip') { $$('.tl-clip.selected').forEach(x => x.classList.remove('selected')); el.classList.add('selected'); return; }
    if (act === 'clip-up') { if (i > 0) { [p.edit.clips[i - 1], p.edit.clips[i]] = [p.edit.clips[i], p.edit.clips[i - 1]]; scheduleSave(); render(); } return; }
    if (act === 'clip-down') { if (i < p.edit.clips.length - 1) { [p.edit.clips[i + 1], p.edit.clips[i]] = [p.edit.clips[i], p.edit.clips[i + 1]]; scheduleSave(); render(); } return; }
    if (act === 'clip-del') { p.edit.clips.splice(i, 1); scheduleSave(); render(); return; }
    if (act === 'add-clip') { return modalClip(p); }
    if (act === 'toggle-sub') { p.edit.subtitles = !p.edit.subtitles; scheduleSave(); render(); return; }
    if (act === 'save-bgm') { p.edit.bgm = $('#bgmInput').value; scheduleSave(); toast('配乐已保存', 'ok'); return; }
    if (act === 'edit-to-export') { currentView = 'export'; render(); return; }

    // 导出中心
    if (act === 'do-export') {
      const s = p.export.settings;
      p.export.records.unshift({ id: Store.uid('exp'), name: `${p.script.title || 'EP001'}_v${p.export.records.length + 1}`, time: Store.now(), settings: `${s.resolution} · ${s.fps}fps · ${s.format}`, status: 'done', size: (Math.random() * 200 + 50).toFixed(0) + ' MB' });
      scheduleSave(); render(); toast('已生成导出记录（原型）', 'ok'); return;
    }
    if (act === 'del-export') { p.export.records = p.export.records.filter(x => x.id !== el.dataset.id); scheduleSave(); render(); return; }

    // 资产库
    if (act === 'asset-tab') { assetTab = el.dataset.tab; render(); return; }

    // 谱系视图（v2.4）
    if (act === 'ln-reset') { Store.resetLineageLayout(p.id); render(); toast('已恢复自动布局', 'ok'); return; }
    if (act === 'ln-export') {
      const json = Store.exportProject(p.id);
      if (!json) { toast('导出失败', 'err'); return; }
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '出片包_' + (p.script.title || p.name).replace(/[\\/:*?"<>|]/g, '_') + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      toast('已下载出片包；素材放 素材/<镜号>.mp4 后运行 tools/出片.js', 'ok'); return;
    }
    if (act === 'ln-issue' || act === 'ln-gate') {
      if (act === 'ln-gate' && p.ecom) {
        const g = (p.ecom.gates || []).find(x => x.id === el.dataset.id);
        if (g) { g.done = !g.done; scheduleSave(); render(); toast('门槛状态已更新', 'ok'); }
        return;
      }
      const d = Lineage.build(p);
      const node = d.nodes.find(n => n.id === el.dataset.node);
      if (node && VIEW_TITLE[node.view]) { currentView = node.view; render(); }
      return;
    }
  }

  function importScript(p, txt) {
    const parts = txt.split(/^##\s+/m).filter(Boolean);
    const scenes = [];
    parts.forEach(part => {
      const lines = part.split('\n');
      const title = lines[0].trim();
      const m = title.match(/(EP\d+-SC\d+)/);
      scenes.push({ id: m ? m[1] : 'SC' + String(scenes.length + 1).padStart(3, '0'), location: title.replace(/^EP\d+-SC\d+\s*/, '').slice(0, 20) || '场景', time: '', content: lines.slice(1).join('\n').trim() });
    });
    if (scenes.length) p.script.scenes = scenes;
  }

  function importStoryboard(p, txt) {
    const blocks = txt.split(/^##\s+SHOT-/m).slice(1);
    const shots = [];
    blocks.forEach((b, idx) => {
      const title = ('SHOT-' + b.split('\n')[0].trim()) || ('SHOT-' + (idx + 1));
      const get = k => { const m = b.match(new RegExp('- ' + k + '：([^\\n]+)')); return m ? m[1].trim() : ''; };
      const dur = parseInt((b.match(/- 时长：(\d+)s/) || [])[1] || '3', 10);
      const modeRaw = get('生成模式');
      const mode = /videoExtend2video/i.test(modeRaw) ? 'videoExtend2video' : /mixed2video/i.test(modeRaw) ? 'mixed2video' : 'text2video';
      const tailFrom = (get('衔接').match(/SHOT-?[\w-]+/i) || [''])[0].replace(/^SHOT-?/i, 'SHOT-');
      const layered = get('声音分层');
      const soundLayers = [];
      if (layered) layered.split(/[｜|]/).map(s => s.trim()).filter(Boolean).forEach(part => {
        const vm = part.match(/^([^：:]+)[：:]\s*(.*)$/);
        const label = vm ? vm[1].trim() : '', text = vm ? vm[2].trim() : part;
        if (!text || text === '无') return;
        soundLayers.push({ kind: /旁白|VO/i.test(label) ? 'vo' : /环境/i.test(label) ? 'ambience' : /音效/i.test(label) ? 'sfx' : 'bgm', text, voiceId: (part.match(/VOICE-[\w-]+/) || [''])[0] });
      });
      shots.push({ id: title.replace(/[^\w-]/g, ''), name: title.split('·').pop().trim(), sceneId: (get('来源').match(/EP\d+-SC\d+/) || ['EP001-SC001'])[0], duration: dur,
        purpose: get('目的'), shotSize: get('景别/机位') || '中景', camera: get('景别/机位') || '', movement: get('运镜') || '固定',
        start: get('起点'), action: get('动作'), end: get('终点'), assets: get('出场设定'),
        sound: get('声音') || soundLayers.map(l => l.text).join('；'),
        mode, tailFrom: tailFrom || '', transition: get('转场') || '硬切', soundLayers, segment: '' });
    });
    if (shots.length) p.storyboard.shots = shots;
  }

  async function aiGenerate(kind, p, src) {
    if (!CloudAI.available && !CloudAI.init()) {
      toast('AI 服务未就绪：请检查网络后刷新', 'err'); return;
    }
    aiBusy(kind === 'script' ? '正在改编剧本…' : '正在拆分镜…');
    const streamEl = () => $('#aiStream');
    try {
      let text = '';
      if (kind === 'script') {
        text = await CloudAI.generateScript(src, p.type, p.script.targetSeconds, partial => {
          const el = streamEl(); if (el) { el.textContent = partial.slice(-600); el.scrollTop = el.scrollHeight; }
        });
        const scenes = Bridge.parseBundle([{ name: '剧本.md', content: text }]).scriptScenes;
        if (!scenes || !scenes.length) throw new Error('AI 返回内容未能解析为剧本场景');
        p.script.scenes = scenes;
        p.script.title = p.script.title && p.script.title !== '未命名' ? p.script.title : 'AI 生成剧本';
      } else {
        const scriptText = p.script.scenes.map(s => `## ${s.id} ${s.location}\n${s.content}`).join('\n\n');
        text = await CloudAI.generateStoryboard(scriptText, p.storyboard.targetSeconds, partial => {
          const el = streamEl(); if (el) { el.textContent = partial.slice(-600); el.scrollTop = el.scrollHeight; }
        }, p.production);
        const parsed = Bridge.parseBundle([{ name: '分镜.md', content: text }]).storyboard;
        if (!parsed || !parsed.shots.length) throw new Error('AI 返回内容未能解析为分镜');
        p.storyboard.shots = parsed.shots;
        p.storyboard.fullTotal = parsed.fullTotal;
        p.storyboard.fullCount = parsed.fullCount;
      }
      p.updatedAt = Store.now(); scheduleSave(); closeModal(); render();
      toast(kind === 'script' ? `已生成 ${p.script.scenes.length} 场剧本` : `已生成 ${p.storyboard.shots.length} 个镜头`, 'ok');
    } catch (e) {
      closeModal();
      const code = e && e.error && e.error.code;
      let msg = e && e.message ? e.message : '生成失败';
      if (code === 'quota_exhausted' || String(code).startsWith('quota')) msg = 'AI 额度已用完，请稍后再试或联系管理员';
      else if (String(code).startsWith('auth')) msg = 'AI 身份校验失败，请刷新页面重试';
      else if (String(code).startsWith('gateway') || String(code).startsWith('model')) msg = 'AI 服务暂时不可用，请重试';
      toast('生成失败：' + msg, 'err');
    }
  }

  // ============ 一键导入桥弹窗 ============
  function modalBridge(p) {
    openModal('一键导入 · 导演技能产物', `
      <div class="bridge-drop" id="bridgeDrop">
        <div class="bd-ico">📥</div>
        <div class="bd-title">选择或拖入技能产出的文件</div>
        <div class="bd-desc">可多选：剧本.md · 分镜.md · 设定清单.md · 素材事实表.md · 本集配置.json</div>
        <input type="file" id="bridgeFiles" multiple accept=".md,.json,.txt" hidden>
        <button class="btn btn-outline btn-sm" id="bridgePick" type="button">选择文件</button>
      </div>
      <div class="field" style="margin-top:14px"><label>没有文件？直接粘贴多个文件内容（用文件名分隔）</label>
        <textarea class="textarea" id="bridgePaste" style="min-height:150px;font-family:monospace;font-size:11px" placeholder="==== 剧本.md ====\n# EP001 …\n\n==== 分镜.md ====\n## SHOT-EP001-001 …"></textarea></div>
      <div class="mini-note">解析器按内容特征自动识别文件类型，与文件名无关。已存在的数据会被对应产物覆盖。</div>
    `, `<button class="btn btn-ghost" data-mact="cancel">取消</button><button class="btn btn-primary" id="bridgeDo" data-mact="confirm">解析并导入</button>`, true);

    const pick = $('#bridgeFiles');
    $('#bridgePick').onclick = () => pick.click();
    const drop = $('#bridgeDrop');
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', e => { readFiles(e.dataTransfer.files); });
    pick.addEventListener('change', e => { readFiles(e.target.files); });

    const fileContents = [];
    function readFiles(fileList) {
      [...fileList].forEach(f => {
        const r = new FileReader();
        r.onload = () => {
          fileContents.push({ name: f.name, content: r.result });
          const bd = $('.bd-desc'); if (bd) bd.textContent = `已就绪 ${fileContents.length} 个文件：` + fileContents.map(x => x.name).join('、');
        };
        r.readAsText(f);
      });
    }

    // 覆盖 confirm 行为
    modalConfirm = null;
    $('#modalFoot').onclick = e => {
      const b = e.target.closest('[data-mact]'); if (!b) return;
      if (b.dataset.mact === 'cancel') { closeModal(); return; }
      if (b.id !== 'bridgeDo') return;
      let files = [...fileContents];
      const pasted = ($('#bridgePaste') || {}).value || '';
      if (pasted.trim()) {
        pasted.split(/^====\s*([^\n]+?)\s*====$/m).forEach((seg, i, arr) => {
          if (i % 2 === 1) files.push({ name: arr[i], content: arr[i + 1] || '' });
        });
        if (!files.length) files.push({ name: '粘贴内容.md', content: pasted });
      }
      if (!files.length) { toast('请先选择文件或粘贴内容', 'err'); return; }
      const parsed = Bridge.parseBundle(files);
      if (!parsed.ok) { toast('未能识别出可导入的内容，请检查文件内容', 'err'); return; }
      const changes = Bridge.applyToProject(p, parsed);
      scheduleSave(); closeModal(); render();
      toast('导入完成：' + changes.join('、'), 'ok');
    };
  }

  function modalChar(p, idx) {
    const c = idx != null ? p.setup.characters[idx] : { name: '', role: '', desc: '', emoji: '👤', traits: [], prompt: '' };
    openModal(idx != null ? '编辑人物' : '新增人物', `
      <div class="row"><div class="field"><label>姓名</label><input class="input" id="mCname" value="${esc(c.name)}"></div>
        <div class="field"><label>标识 emoji</label><input class="input" id="mCemoji" value="${esc(c.emoji)}" maxlength="4"></div></div>
      <div class="field"><label>角色定位</label><input class="input" id="mCrole" value="${esc(c.role)}" placeholder="例如：男主 · 装修木工"></div>
      <div class="field"><label>外貌与性格</label><textarea class="textarea" id="mCdesc" style="min-height:80px">${esc(c.desc)}</textarea></div>
      <div class="field"><label>可辨识特征（逗号分隔）</label><input class="input" id="mCtraits" value="${esc(c.traits.join('，'))}"></div>
      <div class="field"><label>生成提示词</label><textarea class="textarea" id="mCprompt" style="min-height:70px">${esc(c.prompt)}</textarea></div>`, '', true);
    modalConfirm = () => {
      const name = $('#mCname').value.trim(); if (!name) { toast('请填写姓名', 'err'); return; }
      const obj = { id: c.id || Store.uid('CHAR'), name, role: $('#mCrole').value.trim(), desc: $('#mCdesc').value, emoji: $('#mCemoji').value.trim() || '👤',
        traits: $('#mCtraits').value.split(/[,，]/).map(x => x.trim()).filter(Boolean), prompt: $('#mCprompt').value, views: c.views || { front: false, side: false, back: false } };
      if (idx != null) p.setup.characters[idx] = obj; else p.setup.characters.push(obj);
      scheduleSave(); closeModal(); render(); toast('人物已保存', 'ok');
    };
  }

  function modalSceneSet(p) {
    openModal('新增场景', `
      <div class="field"><label>场景名称</label><input class="input" id="mSNname" placeholder="例如：工地板房"></div>
      <div class="field"><label>描述</label><textarea class="textarea" id="mSNdesc"></textarea></div>
      <div class="field"><label>生成提示词</label><input class="input" id="mSNprompt"></div>`);
    modalConfirm = () => { const name = $('#mSNname').value.trim(); if (!name) { toast('请填写名称', 'err'); return; }
      p.setup.scenes.push({ id: Store.uid('LOC'), name, desc: $('#mSNdesc').value, prompt: $('#mSNprompt').value });
      scheduleSave(); closeModal(); render(); toast('场景已添加', 'ok'); };
  }

  function modalProp(p) {
    openModal('新增道具', `
      <div class="field"><label>道具名称</label><input class="input" id="mPname"></div>
      <div class="field"><label>说明</label><textarea class="textarea" id="mPdesc"></textarea></div>`);
    modalConfirm = () => { const name = $('#mPname').value.trim(); if (!name) { toast('请填写名称', 'err'); return; }
      p.setup.props.push({ id: Store.uid('PROP'), name, desc: $('#mPdesc').value });
      scheduleSave(); closeModal(); render(); toast('道具已添加', 'ok'); };
  }

  function modalVoice(p) {
    openModal('新增音色锚点', `
      <div class="field"><label>锚点名称（如：说书先生 / 旁白）</label><input class="input" id="mVname" placeholder="说书先生"></div>
      <div class="field"><label>音色描述</label><input class="input" id="mVdesc" placeholder="中老年男声、沙哑、语速偏慢"></div>
      <div class="field"><label>样本说明</label><input class="input" id="mVsample" placeholder="8 秒干净人声样本"></div>
      <div class="mini-note">音色锚点 ID 自动生成（VOICE-xxx），供分镜的「声音分层」引用，保证跨镜音色一致。本台只登记锚点，不生成音频。</div>`);
    modalConfirm = () => {
      const name = $('#mVname').value.trim(); if (!name) { toast('请填写名称', 'err'); return; }
      if (!Array.isArray(p.setup.voiceAssets)) p.setup.voiceAssets = [];
      p.setup.voiceAssets.push({ id: 'VOICE-' + Store.uid('V').split('_').pop().toUpperCase(), name, desc: $('#mVdesc').value, sample: $('#mVsample').value, voiceId: '' });
      scheduleSave(); closeModal(); render(); toast('音色锚点已添加', 'ok');
    };
  }

  function modalShot(p, idx) {
    const s = idx != null ? p.storyboard.shots[idx] : { id: 'SHOT-EP001-' + String(p.storyboard.shots.length + 1).padStart(3, '0'), name: '', sceneId: 'EP001-SC001', duration: 3, purpose: '', shotSize: '中景', camera: '', movement: '固定', start: '', action: '', end: '', assets: '', sound: '' };
    openModal(idx != null ? '编辑镜头' : '新增镜头', `
      <div class="row"><div class="field"><label>镜号</label><input class="input" id="mHid" value="${esc(s.id)}"></div>
        <div class="field"><label>时长（秒）</label><input class="input" type="number" id="mHdur" value="${s.duration}"></div></div>
      <div class="field"><label>镜名</label><input class="input" id="mHname" value="${esc(s.name)}"></div>
      <div class="row"><div class="field"><label>来源场景</label><input class="input" id="mHscene" value="${esc(s.sceneId)}"></div>
        <div class="field"><label>景别/机位</label><input class="input" id="mHsize" value="${esc(s.shotSize)}"></div></div>
      <div class="row"><div class="field"><label>运镜</label><input class="input" id="mHmove" value="${esc(s.movement)}"></div>
        <div class="field"><label>出场设定ID</label><input class="input" id="mHassets" value="${esc(s.assets)}"></div></div>
      <div class="row"><div class="field"><label>生成模式</label><select class="select" id="mHmode">
        <option value="text2video" ${s.mode === 'text2video' ? 'selected' : ''}>text2video</option>
        <option value="mixed2video" ${s.mode === 'mixed2video' ? 'selected' : ''}>mixed2video</option>
        <option value="videoExtend2video" ${s.mode === 'videoExtend2video' ? 'selected' : ''}>videoExtend2video</option></select></div>
        <div class="field"><label>衔接尾帧</label><input class="input" id="mHtail" value="${esc(s.tailFrom || '')}" placeholder="SHOT-EP001-001"></div></div>
      <div class="row"><div class="field"><label>转场</label><input class="input" id="mHtrans" value="${esc(s.transition || '硬切')}"></div>
        <div class="field"><label>分段组</label><input class="input" id="mHseg" value="${esc(s.segment || '')}" placeholder="SEG-1"></div></div>
      <div class="field"><label>目的</label><input class="input" id="mHpurpose" value="${esc(s.purpose)}"></div>
      <div class="field"><label>起点 → 动作 → 终点</label>
        <input class="input" id="mHstart" value="${esc(s.start)}" placeholder="起点" style="margin-bottom:6px">
        <input class="input" id="mHaction" value="${esc(s.action)}" placeholder="动作" style="margin-bottom:6px">
        <input class="input" id="mHend" value="${esc(s.end)}" placeholder="终点"></div>
      <div class="field"><label>声音</label><input class="input" id="mHsound" value="${esc(s.sound)}"></div>`, '', true);
    modalConfirm = () => {
      const obj = { id: $('#mHid').value.trim() || Store.uid('SHOT'), name: $('#mHname').value.trim() || '未命名镜头', sceneId: $('#mHscene').value.trim(),
        duration: +$('#mHdur').value || 3, purpose: $('#mHpurpose').value, shotSize: $('#mHsize').value, camera: $('#mHsize').value, movement: $('#mHmove').value,
        start: $('#mHstart').value, action: $('#mHaction').value, end: $('#mHend').value, assets: $('#mHassets').value, sound: $('#mHsound').value,
        mode: $('#mHmode').value, tailFrom: $('#mHtail').value.trim(), transition: $('#mHtrans').value.trim() || '硬切', segment: $('#mHseg').value.trim(),
        soundLayers: (idx != null && p.storyboard.shots[idx].soundLayers) ? p.storyboard.shots[idx].soundLayers : [] };
      if (idx != null) p.storyboard.shots[idx] = obj; else p.storyboard.shots.push(obj);
      scheduleSave(); closeModal(); render(); toast('镜头已保存', 'ok');
    };
  }

  function modalGenTask(p) {
    openModal('新建生成任务', `
      <div class="field"><label>关联镜头</label><select class="select" id="mGshot">
        ${p.storyboard.shots.map(s => `<option value="${esc(s.id)}">${esc(s.id.replace('SHOT-', ''))} · ${esc(s.name)}</option>`).join('') || '<option value="">（暂无镜头，可手动命名）</option>'}</select></div>
      <div class="field"><label>任务名称</label><input class="input" id="mGname" placeholder="留空则取镜头名"></div>
      <div class="row"><div class="field"><label>类型</label><select class="select" id="mGtype"><option value="video">视频</option><option value="image">图片</option></select></div>
        <div class="field"><label>模型</label><select class="select" id="mGmodel"><option>Seedance</option><option>即梦</option><option>LibTV</option></select></div></div>
      <div class="row"><div class="field"><label>生成模式</label><select class="select" id="mGmode">
        <option value="text2video">text2video · 从零生成</option>
        <option value="mixed2video">mixed2video · 多参考保人设</option>
        <option value="videoExtend2video">videoExtend2video · 尾帧续写</option></select></div>
        <div class="field"><label>衔接尾帧（承接镜头 ID，可留空）</label><input class="input" id="mGtail" placeholder="SHOT-EP001-001"></div></div>
      <div class="field"><label>提示词</label><textarea class="textarea" id="mGprompt" style="min-height:90px"></textarea></div>`);
    modalConfirm = () => {
      const shotId = $('#mGshot').value || 'SHOT-MANUAL';
      const name = $('#mGname').value.trim() || (p.storyboard.shots.find(s => s.id === shotId)?.name || '新任务');
      const tail = $('#mGtail').value.trim();
      p.generate.tasks.unshift({ id: Store.uid('gen'), shotId, name, type: $('#mGtype').value, model: $('#mGmodel').value, status: 'queued', progress: 0, prompt: $('#mGprompt').value, createdAt: Store.now(),
        mode: $('#mGmode').value, tailFrom: tail, dependsOn: tail ? [tail] : [] });
      scheduleSave(); closeModal(); render(); toast('任务已加入队列', 'ok');
    };
  }

  function modalClip(p) {
    openModal('添加剪辑片段', `
      <div class="row"><div class="field"><label>片段名称</label><input class="input" id="mCpname"></div>
        <div class="field"><label>时长（秒）</label><input class="input" type="number" id="mCpdur" value="3"></div></div>
      <div class="row"><div class="field"><label>转场</label><select class="select" id="mCptr"><option>硬切</option><option>叠化</option><option>推近</option><option>淡入</option></select></div>
        <div class="field"><label>轨道</label><select class="select" id="mCptrack"><option>V1</option><option>V2</option></select></div></div>`);
    modalConfirm = () => {
      const name = $('#mCpname').value.trim(); if (!name) { toast('请填写名称', 'err'); return; }
      const colors = ['#ff6b35', '#ff9d3d', '#9b7bff', '#5aa9ff', '#3ecfb0', '#ffc94d'];
      p.edit.clips.push({ id: Store.uid('clip'), shotId: '', name, duration: +$('#mCpdur').value || 3, color: colors[p.edit.clips.length % colors.length], track: $('#mCptrack').value, transition: $('#mCptr').value });
      scheduleSave(); closeModal(); render(); toast('片段已添加', 'ok');
    };
  }

  function confirmReset() {
    openModal('🦍 猩猩导演台',
      `<div style="text-align:center;padding:8px 0 4px">
        <div style="font-size:15px;line-height:1.8;color:var(--txt-1)">一站式短剧创作工作台<br>文字 → 剧本 → 设定 → 分镜 → 生成 → 剪辑 → 导出</div>
        <div class="divider"></div>
        <div style="text-align:left;font-size:11.5px;color:var(--txt-2);line-height:1.8">
          · 数据存在本机浏览器，自动保存<br>
          · 顶栏「备份 / 恢复」可导出或导入 JSON<br>
          · 原型中生成、渲染为模拟，实际创作在对话中完成<br>
          · 点击品牌可随时打开本说明
        </div></div>`,
      `<button class="btn btn-ghost" data-mact="cancel">关闭</button>
       <button class="btn btn-danger" data-mact="reset">重置为示例数据</button>`);
    $('#modalFoot').onclick = e => {
      const b = e.target.closest('[data-mact]'); if (!b) return;
      if (b.dataset.mact === 'cancel') closeModal();
      if (b.dataset.mact === 'reset') {
        if (confirm('确定重置？当前所有项目将被示例数据覆盖。建议先备份。')) {
          Store.resetToSeed(); closeModal(); refresh(); render(); toast('已重置为示例数据', 'ok');
        }
      }
    };
  }

  // ============ Toast ============
  function toast(msg, type = 'ok') {
    const wrap = $('#toastWrap');
    const t = document.createElement('div');
    t.className = 'toast' + (type === 'ok' ? '' : ' ' + type);
    const ico = type === 'err' ? '⛔' : type === 'warn' ? '⚠️' : '✓';
    t.innerHTML = `<span class="t-ico">${ico}</span><span>${esc(msg)}</span>`;
    wrap.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(20px)'; t.style.transition = '.3s'; }, 3200);
    setTimeout(() => t.remove(), 3600);
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
